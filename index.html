<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SideQuest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
:root {
  --bg: #0d0f0b;
  --bg2: #111410;
  --surface: #161a13;
  --surface2: #1c211a;
  --border: #252b21;
  --border-strong: #2f3829;
  --green: #1a7a3c;
  --green-bright: #22c55e;
  --green-pale: #0f1f14;
  --green-mid: #1a3322;
  --silver: #4a5447;
  --silver-light: #3a4237;
  --ink: #e8ede4;
  --ink-mid: #b8c4b2;
  --ink-light: #7a8875;
  --red: #e74c3c;
  --font-display: 'Bebas Neue', sans-serif;
  --font-body: 'Outfit', sans-serif;
  --font-mono: 'DM Mono', monospace;
  --radius: 14px;
  --radius-sm: 9px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); overflow-x: hidden; min-height: 100vh; }
button { cursor: pointer; font-family: var(--font-body); }
input, textarea, select { font-family: var(--font-body); }
a { color: inherit; text-decoration: none; }
::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: var(--bg2); } ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

/* ── UTILS ── */
.hidden { display: none !important; }
.flex { display: flex; }
.flex-col { display: flex; flex-direction: column; }
.gap-1 { gap: .5rem; }
.gap-2 { gap: 1rem; }
.gap-3 { gap: 1.5rem; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.w-full { width: 100%; }
.text-green { color: var(--green-bright); }
.text-dim { color: var(--ink-light); }
.text-sm { font-size: .82rem; }
.text-xs { font-size: .72rem; }
.font-mono { font-family: var(--font-mono); }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── LAYOUT ── */
#app { min-height: 100vh; }
.page { min-height: 100vh; padding-bottom: 5rem; }

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  display: flex; justify-content: space-between; align-items: center;
  padding: .9rem 1.5rem;
  background: rgba(13,15,11,.92); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.nav-logo { font-family: var(--font-display); font-size: 1.4rem; letter-spacing: 3px; color: var(--ink); display: flex; align-items: center; gap: .5rem; }
.nav-logo-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green-bright); box-shadow: 0 0 8px rgba(34,197,94,.5); animation: breathe 3s ease-in-out infinite; }
@keyframes breathe { 0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.6} }
.nav-actions { display: flex; gap: .6rem; align-items: center; }
.nav-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; cursor: pointer; border: 2px solid var(--green-mid); }
.nav-link { font-size: .8rem; font-weight: 600; color: var(--ink-light); padding: .4rem .8rem; border-radius: 99px; transition: all .2s; }
.nav-link:hover, .nav-link.active { color: var(--green-bright); background: var(--green-pale); }

/* ── BOTTOM NAV (mobile) ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: rgba(13,15,11,.97); border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; padding: .6rem .5rem;
}
.bnav-item { display: flex; flex-direction: column; align-items: center; gap: .2rem; padding: .3rem .8rem; border-radius: var(--radius-sm); color: var(--ink-light); font-size: .6rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; transition: all .2s; background: none; border: none; }
.bnav-item svg { width: 20px; height: 20px; }
.bnav-item.active { color: var(--green-bright); background: var(--green-pale); }

/* ── FORMS ── */
.input {
  width: 100%; background: var(--surface2); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); padding: .8rem 1rem; color: var(--ink);
  font-size: .9rem; outline: none; transition: border-color .2s, box-shadow .2s;
}
.input::placeholder { color: var(--silver); }
.input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(26,122,60,.15); }
textarea.input { resize: vertical; min-height: 90px; }
.label-field { font-size: .78rem; font-weight: 600; color: var(--ink-mid); margin-bottom: .4rem; letter-spacing: .5px; }
.form-group { display: flex; flex-direction: column; margin-bottom: 1.1rem; }

/* ── BUTTONS ── */
.btn { border: none; border-radius: var(--radius-sm); padding: .75rem 1.4rem; font-size: .85rem; font-weight: 700; transition: all .2s; letter-spacing: .3px; }
.btn-primary { background: var(--green); color: #fff; }
.btn-primary:hover { background: #145f2e; transform: translateY(-1px); box-shadow: 0 6px 24px rgba(26,122,60,.3); }
.btn-secondary { background: var(--surface2); color: var(--ink); border: 1px solid var(--border-strong); }
.btn-secondary:hover { border-color: var(--green-mid); background: var(--green-pale); }
.btn-ghost { background: none; color: var(--ink-light); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--ink); border-color: var(--border-strong); }
.btn-danger { background: rgba(231,76,60,.1); color: var(--red); border: 1px solid rgba(231,76,60,.2); }
.btn-danger:hover { background: rgba(231,76,60,.2); }
.btn-sm { padding: .4rem .9rem; font-size: .78rem; }
.btn-full { width: 100%; }
.btn-icon { display: inline-flex; align-items: center; gap: .5rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none !important; }

/* ── CARDS ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem 1.4rem; }
.card:hover { border-color: var(--border-strong); }

/* ── AUTH PAGES ── */
.auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; background: var(--bg); }
.auth-box { width: 100%; max-width: 420px; }
.auth-logo { font-family: var(--font-display); font-size: 2.5rem; letter-spacing: 4px; color: var(--ink); margin-bottom: .3rem; display: flex; align-items: center; gap: .6rem; }
.auth-sub { font-size: .88rem; color: var(--ink-light); margin-bottom: 2.5rem; line-height: 1.6; }
.auth-box h2 { font-family: var(--font-display); font-size: 1.8rem; letter-spacing: 2px; margin-bottom: 1.8rem; color: var(--ink); }
.auth-switch { text-align: center; margin-top: 1.5rem; font-size: .84rem; color: var(--ink-light); }
.auth-switch a { color: var(--green-bright); font-weight: 600; }
.auth-error { background: rgba(231,76,60,.1); border: 1px solid rgba(231,76,60,.3); color: #f08080; font-size: .82rem; padding: .7rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1rem; }

/* ── TAGS ── */
.tag {
  display: inline-flex; align-items: center; gap: .3rem;
  font-family: var(--font-mono); font-size: .65rem; letter-spacing: 1.5px; text-transform: uppercase;
  padding: .3rem .7rem; border-radius: 99px;
  background: var(--green-pale); color: var(--green-bright); border: 1px solid var(--green-mid);
}
.tag-list { display: flex; flex-wrap: wrap; gap: .4rem; }
.tag-select-btn {
  font-family: var(--font-mono); font-size: .65rem; letter-spacing: 1px; text-transform: uppercase;
  padding: .35rem .8rem; border-radius: 99px; background: var(--surface2);
  border: 1px solid var(--border); color: var(--ink-light); cursor: pointer; transition: all .2s;
}
.tag-select-btn.selected { background: var(--green-pale); border-color: var(--green-mid); color: var(--green-bright); }

/* ── QUEST CARD ── */
.quest-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; transition: all .25s; cursor: pointer;
}
.quest-card:hover { border-color: var(--green-mid); box-shadow: 0 8px 32px rgba(0,0,0,.4); transform: translateY(-2px); }
.quest-card-header { padding: 1.1rem 1.3rem .8rem; border-bottom: 1px solid var(--border); }
.quest-category-label { font-family: var(--font-mono); font-size: .6rem; letter-spacing: 3px; text-transform: uppercase; color: var(--green-bright); margin-bottom: .5rem; display: flex; align-items: center; gap: .4rem; }
.quest-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green-bright); }
.quest-title { font-family: var(--font-display); font-size: 1.35rem; letter-spacing: 1px; line-height: 1.1; color: var(--ink); margin-bottom: .5rem; }
.quest-desc { font-size: .82rem; color: var(--ink-light); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.quest-card-meta { padding: .8rem 1.3rem; display: flex; gap: 1.2rem; flex-wrap: wrap; }
.quest-meta-item { display: flex; align-items: center; gap: .4rem; font-size: .75rem; color: var(--ink-light); font-family: var(--font-mono); }
.quest-card-footer { padding: .8rem 1.3rem; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); }
.avatar-stack { display: flex; }
.avatar-sm { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--surface); display: flex; align-items: center; justify-content: center; font-size: .58rem; font-weight: 700; color: #fff; margin-left: -7px; flex-shrink: 0; }
.avatar-sm:first-child { margin-left: 0; }
.spots-label { font-size: .72rem; color: var(--ink-light); font-family: var(--font-mono); margin-left: .6rem; }

/* ── FEED ── */
.feed-page { padding-top: 4.5rem; }
.feed-header { padding: 1.5rem 1.2rem 1rem; }
.feed-title { font-family: var(--font-display); font-size: 2.2rem; letter-spacing: 2px; line-height: 1; }
.feed-title .green { color: var(--green-bright); }
.feed-filters { padding: .5rem 1.2rem 1rem; display: flex; gap: .5rem; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
.feed-filters::-webkit-scrollbar { display: none; }
.filter-btn { font-family: var(--font-mono); font-size: .65rem; letter-spacing: 2px; text-transform: uppercase; padding: .4rem 1rem; border-radius: 99px; background: var(--surface2); border: 1px solid var(--border); color: var(--ink-light); white-space: nowrap; transition: all .2s; }
.filter-btn.active { background: var(--green-pale); border-color: var(--green-mid); color: var(--green-bright); }
.feed-grid { padding: 0 1rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
.feed-empty { text-align: center; padding: 4rem 2rem; color: var(--ink-light); }
.feed-empty .big { font-family: var(--font-display); font-size: 3rem; letter-spacing: 2px; color: var(--border-strong); }
.fab {
  position: fixed; bottom: 5rem; right: 1.2rem; z-index: 100;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--green); border: none; color: #fff;
  font-size: 1.6rem; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(34,197,94,.3); transition: all .2s;
}
.fab:hover { background: #145f2e; transform: scale(1.1); }

/* ── QUEST DETAIL ── */
.detail-page { padding-top: 4.5rem; max-width: 680px; margin: 0 auto; padding-left: 1rem; padding-right: 1rem; }
.detail-back { display: flex; align-items: center; gap: .5rem; color: var(--ink-light); font-size: .82rem; padding: 1rem 0; cursor: pointer; transition: color .2s; }
.detail-back:hover { color: var(--green-bright); }
.detail-cat { font-family: var(--font-mono); font-size: .65rem; letter-spacing: 3px; text-transform: uppercase; color: var(--green-bright); margin-bottom: .6rem; }
.detail-title { font-family: var(--font-display); font-size: clamp(2rem, 6vw, 3rem); letter-spacing: 2px; line-height: 1.05; color: var(--ink); margin-bottom: .8rem; }
.detail-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; margin: 1.2rem 0; }
.detail-meta-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: .8rem 1rem; }
.detail-meta-card .mlabel { font-family: var(--font-mono); font-size: .6rem; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-light); margin-bottom: .2rem; }
.detail-meta-card .mval { font-size: .88rem; font-weight: 600; color: var(--ink); }
.detail-desc { font-size: .9rem; color: var(--ink-mid); line-height: 1.8; margin: 1.2rem 0; }
.members-section { margin: 1.5rem 0; }
.section-label { font-family: var(--font-mono); font-size: .65rem; letter-spacing: 3px; text-transform: uppercase; color: var(--green); margin-bottom: 1rem; display: flex; align-items: center; gap: .6rem; }
.section-label::before { content:''; width: 14px; height: 1.5px; background: var(--green); }
.member-list { display: flex; flex-direction: column; gap: .6rem; }
.member-item { display: flex; align-items: center; gap: .8rem; padding: .7rem 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); }
.member-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .78rem; font-weight: 700; color: #fff; flex-shrink: 0; }
.member-name { font-size: .88rem; font-weight: 600; color: var(--ink); }
.member-role { font-size: .7rem; color: var(--ink-light); font-family: var(--font-mono); }
.creator-badge { font-family: var(--font-mono); font-size: .58rem; letter-spacing: 1px; text-transform: uppercase; background: var(--green-pale); color: var(--green-bright); border: 1px solid var(--green-mid); padding: .2rem .5rem; border-radius: 99px; margin-left: auto; }

/* ── CHAT ── */
.chat-section { margin: 1.5rem 0; }
.chat-box {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; display: flex; flex-direction: column; height: 360px;
}
.chat-messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .6rem; }
.chat-msg { display: flex; gap: .6rem; align-items: flex-start; }
.chat-msg.own { flex-direction: row-reverse; }
.chat-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .6rem; font-weight: 700; color: #fff; flex-shrink: 0; margin-top: .1rem; }
.chat-bubble { max-width: 75%; padding: .6rem .9rem; border-radius: 12px; font-size: .83rem; line-height: 1.5; }
.chat-msg:not(.own) .chat-bubble { background: var(--surface2); border: 1px solid var(--border); color: var(--ink); border-radius: 2px 12px 12px 12px; }
.chat-msg.own .chat-bubble { background: var(--green); color: #fff; border-radius: 12px 2px 12px 12px; }
.chat-name { font-size: .62rem; color: var(--ink-light); font-family: var(--font-mono); margin-bottom: .2rem; }
.chat-time { font-size: .6rem; color: var(--ink-light); margin-top: .2rem; }
.chat-input-row { display: flex; gap: .5rem; padding: .8rem 1rem; border-top: 1px solid var(--border); background: var(--surface2); }
.chat-input { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 99px; padding: .55rem 1rem; color: var(--ink); font-size: .83rem; outline: none; }
.chat-input:focus { border-color: var(--green-mid); }
.chat-send { background: var(--green); border: none; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
.chat-send:hover { background: #145f2e; }
.chat-locked { padding: 2rem; text-align: center; color: var(--ink-light); font-size: .83rem; }

/* ── CREATE QUEST ── */
.create-page { padding-top: 4.5rem; max-width: 600px; margin: 0 auto; padding-left: 1rem; padding-right: 1rem; }
.create-header { padding: 1.5rem 0 .5rem; }
.create-header h1 { font-family: var(--font-display); font-size: 2.2rem; letter-spacing: 2px; }

/* ── PROFILE ── */
.profile-page { padding-top: 4.5rem; max-width: 680px; margin: 0 auto; padding-left: 1rem; padding-right: 1rem; }
.profile-header { padding: 1.5rem 0 1rem; display: flex; gap: 1.2rem; align-items: flex-start; }
.profile-avatar-big { width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 700; color: #fff; flex-shrink: 0; }
.profile-name { font-family: var(--font-display); font-size: 1.8rem; letter-spacing: 2px; line-height: 1; }
.profile-bio { font-size: .84rem; color: var(--ink-light); margin-top: .4rem; line-height: 1.6; }
.quests-section { margin: 1.5rem 0; }

/* ── EXPLORE ── */
.explore-page { padding-top: 4.5rem; }
.search-bar-wrap { padding: 1rem 1.2rem; }
.search-bar { width: 100%; background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: .8rem 1rem .8rem 2.8rem; color: var(--ink); font-size: .9rem; outline: none; transition: border-color .2s; }
.search-bar:focus { border-color: var(--green); }
.search-wrap { position: relative; }
.search-icon { position: absolute; left: .9rem; top: 50%; transform: translateY(-50%); color: var(--silver); }

/* ── LOADING ── */
.loading-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
.loading-logo { font-family: var(--font-display); font-size: 2.5rem; letter-spacing: 4px; color: var(--ink); animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }

/* ── MODAL ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(4px); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.modal-box { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 20px; padding: 1.8rem; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; }
.modal-title { font-family: var(--font-display); font-size: 1.6rem; letter-spacing: 2px; margin-bottom: 1.5rem; }

/* ── NOTIFICATIONS ── */
.notif-toast { position: fixed; bottom: 5.5rem; left: 50%; transform: translateX(-50%) translateY(100px); z-index: 999; background: var(--surface2); border: 1px solid var(--green-mid); border-radius: var(--radius-sm); padding: .7rem 1.4rem; font-size: .83rem; color: var(--green-bright); transition: transform .3s; white-space: nowrap; }
.notif-toast.show { transform: translateX(-50%) translateY(0); }

/* ── AVATAR COLORS ── */
.av-0{background:#e67e22}.av-1{background:#2ecc71}.av-2{background:#9b59b6}.av-3{background:#e74c3c}.av-4{background:#3498db}.av-5{background:#1abc9c}.av-6{background:#f39c12}.av-7{background:#e91e63}.av-8{background:#00bcd4}.av-9{background:#4caf50}

/* ── RESPONSIVE ── */
@media(min-width:768px){
  .bottom-nav{display:none}
  .fab{bottom:1.5rem}
  .feed-grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
}
@media(max-width:767px){
  .feed-grid{grid-template-columns:1fr}
  .detail-meta-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app">
  <div class="loading-screen">
    <div class="loading-logo">SIDE<span style="color:var(--green-bright)">QUEST</span></div>
  </div>
</div>

<div class="notif-toast" id="toast"></div>

<script>
// ────────────────────────────────────────────────────────────
// FIREBASE CONFIG — Replace with your own Firebase project config!
// Get this from: Firebase Console → Project Settings → Your Apps
// ────────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyDu5q84MerI1X6XBasaPQmTR3mmfHqeRcA",
  authDomain: "sidequest-8d699.firebaseapp.com",
  projectId: "sidequest-8d699",
  storageBucket: "sidequest-8d699.firebasestorage.app",
  messagingSenderId: "540051485733",
  appId: "1:540051485733:web:667b1671ffd81303877bcc",
  measurementId: "G-XQ52X0W40S"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const rtdb = firebase.database();

// ────────────────────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────────────────────
let state = {
  user: null,
  profile: null,
  currentPage: 'feed',
  quests: [],
  activeQuest: null,
  chatUnsub: null,
  questsUnsub: null,
  filterTag: 'all',
  searchQuery: ''
};

// ────────────────────────────────────────────────────────────
// HELPERS
// ────────────────────────────────────────────────────────────
const TAGS = ['Aventura','Urbano','Natureza','Desporto','Viagem','Social','Noturno','Água','Extremo','Cultural'];
const COLORS = ['#e67e22','#2ecc71','#9b59b6','#e74c3c','#3498db','#1abc9c','#f39c12','#e91e63','#00bcd4','#4caf50'];

function getAvatarColor(str='') {
  let h = 0; for(let c of str) h = (h * 31 + c.charCodeAt(0)) & 0xffff;
  return COLORS[h % COLORS.length];
}
function getInitials(name='') {
  return name.split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase() || '?';
}
function formatDate(ts) {
  if(!ts) return 'A definir';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('pt-PT',{day:'2-digit',month:'short',year:'numeric'});
}
function formatTime(ts) {
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
}
function timeAgo(ts) {
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const diff = (Date.now() - d.getTime()) / 1000;
  if(diff < 60) return 'agora';
  if(diff < 3600) return `${Math.floor(diff/60)}m`;
  if(diff < 86400) return `${Math.floor(diff/3600)}h`;
  return `${Math.floor(diff/86400)}d`;
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}
function el(id) { return document.getElementById(id); }
function esc(str='') { return str.replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderPage() {
  const pc = document.getElementById('page-container');
  if(!pc) return;
  switch(state.currentPage) {

    case 'explore': pc.innerHTML = renderExplorePage(); bindExplore(); break;
    case 'create':  pc.innerHTML = renderCreatePage(); bindCreate(); break;
    case 'profile': pc.innerHTML = renderProfilePage(); break;
    case 'quest':   pc.innerHTML = renderQuestDetail(); bindQuestDetail(); break;
  }
  // sync bottom nav + top nav active states after innerHTML
  document.querySelectorAll('.bnav-item').forEach(b=>{
    b.classList.remove('active');
    if(b.getAttribute('onclick')&&b.getAttribute('onclick').includes(state.currentPage)) b.classList.add('active');
  });
  document.querySelectorAll('.nav-link').forEach(b=>{

}

// ────────────────────────────────────────────────────────────
// NAVIGATION
// ────────────────────────────────────────────────────────────
function navigate(page, data=null) {
  if(state.chatUnsub) { state.chatUnsub(); state.chatUnsub=null; }
  state.currentPage = page;
  if(data) state.activeQuest = data;
  if(state.user) {
    // re-render nav active states
    const navLinks = document.querySelectorAll('.nav-link,.bnav-item');
    navLinks.forEach(b=>{ b.classList.remove('active'); if(b.getAttribute('onclick')&&b.getAttribute('onclick').includes(page)) b.classList.add('active'); });
    const pc = document.getElementById('page-container');
    if(pc) {
      switch(page) {
        case 'feed':    pc.innerHTML=renderFeedPage(); bindFeed(); break;
        case 'explore': pc.innerHTML=renderExplorePage(); bindExplore(); break;
        case 'create':  pc.innerHTML=renderCreatePage(); bindCreate(); break;
        case 'profile': pc.innerHTML=renderProfilePage(); break;
        case 'quest':   pc.innerHTML=renderQuestDetail(); bindQuestDetail(); break;
      }
    }
    window.scrollTo(0,0);
  }
}

function bindFeed() {
  document.querySelectorAll('.quest-card').forEach(card=>{

      const quest = state.quests.find(q=>q.id===id);

    });
  });
}

function setFilter(tag) {
  state.filterTag = tag;
  const pc = document.getElementById('page-container');
  if(pc) { pc.innerHTML=renderFeedPage(); bindFeed(); }
}

function getFilteredQuests() {
  let q = [...state.quests];
  if(state.filterTag !== 'all') q = q.filter(x=>(x.tags||[]).includes(state.filterTag));
  if(state.searchQuery) {
    const s = state.searchQuery.toLowerCase();
    q = q.filter(x=>(x.title||'').toLowerCase().includes(s)||(x.description||'').toLowerCase().includes(s)||(x.location||'').toLowerCase().includes(s));
  }
  return q;
}

        <div class="quest-dot"></div>

      </div>
      <div class="quest-title">${esc(q.title)}</div>
      <div class="quest-desc">${esc(q.description||'')}</div>

function renderAvatarStack(uids) {

    </button>

let selectedTags = [];
function bindCreate() {
  selectedTags = [];
  document.querySelectorAll('.tag-select-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const t = btn.dataset.tag;
      if(selectedTags.includes(t)) {
        selectedTags = selectedTags.filter(x=>x!==t);
        btn.classList.remove('selected');
      } else if(selectedTags.length < 3) {
        selectedTags.push(t);
        btn.classList.add('selected');
      }
    });
  });
  document.getElementById('create-btn')?.addEventListener('click', submitCreateQuest);
}

async function submitCreateQuest() {
  const btn = document.getElementById('create-btn');
  const errEl = document.getElementById('create-error');
  const title = document.getElementById('q-title')?.value.trim();
  const desc = document.getElementById('q-desc')?.value.trim();
  const loc = document.getElementById('q-location')?.value.trim();
  const dateVal = document.getElementById('q-date')?.value;
  const maxP = parseInt(document.getElementById('q-max')?.value)||8;

  if(!title||!desc) { errEl.textContent='Título e descrição são obrigatórios.'; errEl.classList.remove('hidden'); return; }
  if(selectedTags.length===0) { errEl.textContent='Seleciona pelo menos uma tag.'; errEl.classList.remove('hidden'); return; }

  btn.disabled=true; btn.textContent='A publicar...';
  try {
    const questData = {
      title, description: desc, tags: selectedTags,
      location: loc||null, date: dateVal ? firebase.firestore.Timestamp.fromDate(new Date(dateVal)) : null,
      maxPeople: maxP, members: [state.user.uid],
      createdBy: state.user.uid, createdByName: state.profile?.name || state.user.email,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    await db.collection('quests').add(questData);
    showToast('⚡ Quest publicada!');
    navigate('feed');
  } catch(e) {
    errEl.textContent='Erro: '+e.message; errEl.classList.remove('hidden');
    btn.disabled=false; btn.textContent='Publicar Quest';
  }
}

function renderMemberItem(uid, creatorUid) {
  const col = getAvatarColor(uid);
  const init = getInitials(uid.slice(0,4));
  const isCreator = uid === creatorUid;
  return `<div class="member-item">
    <div class="member-avatar" style="background:${col}">${init}</div>
    <div>
      <div class="member-name">${uid === state.user?.uid ? 'Tu' : 'Membro'}</div>
      <div class="member-role font-mono text-xs">${uid.slice(0,8)}...</div>
    </div>
    ${isCreator?'<span class="creator-badge">CRIADOR</span>':''}
  </div>`;
}

function bindQuestDetail() {
  const q = state.activeQuest;
  if(!q) return;

  document.getElementById('join-btn')?.addEventListener('click', ()=>joinQuest(q.id));
  document.getElementById('leave-btn')?.addEventListener('click', ()=>leaveQuest(q.id));
  document.getElementById('delete-btn')?.addEventListener('click', ()=>deleteQuest(q.id));

  const isMember = (q.members||[]).includes(state.user?.uid);
  if(isMember) initChat(q.id);
}

async function joinQuest(questId) {
  try {
    await db.collection('quests').doc(questId).update({
      members: firebase.firestore.FieldValue.arrayUnion(state.user.uid)
    });
    // refresh
    const updated = state.quests.find(q=>q.id===questId);
    if(updated) {
      updated.members = [...(updated.members||[]), state.user.uid];
      state.activeQuest = updated;
    }
    navigate('quest', state.activeQuest);
    showToast('⚡ Entraste na quest!');
  } catch(e) { showToast('Erro: '+e.message); }
}

async function leaveQuest(questId) {
  if(!confirm('Tens a certeza que queres sair desta quest?')) return;
  try {
    await db.collection('quests').doc(questId).update({
      members: firebase.firestore.FieldValue.arrayRemove(state.user.uid)
    });
    const updated = state.quests.find(q=>q.id===questId);
    if(updated) {
      updated.members = (updated.members||[]).filter(u=>u!==state.user.uid);
      state.activeQuest = updated;
    }
    navigate('quest', state.activeQuest);
    showToast('Saíste da quest.');
  } catch(e) { showToast('Erro: '+e.message); }
}

async function deleteQuest(questId) {
  if(!confirm('Eliminar esta quest definitivamente?')) return;
  try {
    await db.collection('quests').doc(questId).delete();
    // delete chat
    const chatRef = rtdb.ref(`chats/${questId}`);
    await chatRef.remove();
    showToast('Quest eliminada.');
    navigate('feed');
  } catch(e) { showToast('Erro: '+e.message); }
}

// ────────────────────────────────────────────────────────────
// CHAT
// ────────────────────────────────────────────────────────────
function initChat(questId) {
  const chatRef = rtdb.ref(`chats/${questId}/messages`);
  const unsub = chatRef.limitToLast(50).on('value', snap=>{
    const msgs = [];
    snap.forEach(child=>msgs.push({id:child.key, ...child.val()}));
    renderChatMessages(msgs);
  });
  state.chatUnsub = ()=>chatRef.off('value', unsub);

  document.getElementById('chat-send')?.addEventListener('click', sendChatMsg);
  document.getElementById('chat-input')?.addEventListener('keydown', e=>{ if(e.key==='Enter') sendChatMsg(); });
}

function renderChatMessages(msgs) {
  const box = document.getElementById('chat-messages');
  if(!box) return;
  if(!msgs.length) { box.innerHTML='<div style="text-align:center;color:var(--ink-light);font-size:.78rem;padding:1rem">Nenhuma mensagem ainda. Sê o primeiro! 👋</div>'; return; }
  box.innerHTML = msgs.map(m=>{
    const own = m.uid === state.user?.uid;
    const col = getAvatarColor(m.uid||'');
    const init = getInitials((m.name||'?'));
    const t = m.ts ? new Date(m.ts) : new Date();
    const timeStr = t.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
    return `<div class="chat-msg ${own?'own':''}">
      <div class="chat-avatar" style="background:${col}">${init}</div>
      <div>
        ${!own?`<div class="chat-name">${esc(m.name||'Anónimo')}</div>`:''}
        <div class="chat-bubble">${esc(m.text||'')}</div>
        <div class="chat-time">${timeStr}</div>
      </div>
    </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

async function sendChatMsg() {
  const input = document.getElementById('chat-input');
  if(!input||!input.value.trim()) return;
  const text = input.value.trim();
  input.value = '';
  const questId = state.activeQuest?.id;
  if(!questId) return;
  await rtdb.ref(`chats/${questId}/messages`).push({
    uid: state.user.uid,
    name: state.profile?.name || state.user.email?.split('@')[0] || 'Anónimo',
    text, ts: Date.now()
  });
}

// ────────────────────────────────────────────────────────────
// PROFILE PAGE
// ────────────────────────────────────────────────────────────
function renderProfilePage() {
  const p = state.profile || {};
  const col = getAvatarColor(state.user?.uid||'');
  const init = getInitials(p.name || state.user?.email||'');
  const myQuests = state.quests.filter(q=>q.createdBy===state.user?.uid);
  const joinedQuests = state.quests.filter(q=>(q.members||[]).includes(state.user?.uid)&&q.createdBy!==state.user?.uid);

  return `<div class="profile-page page">
    <div class="profile-header">
      <div class="profile-avatar-big" style="background:${col}">${init}</div>
      <div style="flex:1">
        <div class="profile-name">${esc(p.name||'Sem nome')}</div>
        <div style="font-size:.78rem;color:var(--ink-light);font-family:var(--font-mono)">${esc(state.user?.email||'')}</div>
        ${p.bio?`<div class="profile-bio">${esc(p.bio)}</div>`:''}
        ${p.interests?.length?`<div class="tag-list" style="margin-top:.6rem">${p.interests.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`:''}
      </div>
    </div>
    <div style="display:flex;gap:.7rem;margin-bottom:1.5rem;flex-wrap:wrap">
      <button class="btn btn-secondary btn-sm btn-icon" id="edit-profile-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Editar Perfil
      </button>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Sair</button>
    </div>
    <div class="quests-section">
      <div class="section-label">As Minhas Quests (${myQuests.length})</div>
      ${myQuests.length ? `<div style="display:flex;flex-direction:column;gap:.7rem">${myQuests.map(q=>renderQuestCard(q)).join('')}</div>` : `<div class="card" style="color:var(--ink-light);font-size:.85rem">Ainda não criaste nenhuma quest.</div>`}
    </div>
    <div class="quests-section" style="margin-top:2rem">
      <div class="section-label">Quests a que me Juntei (${joinedQuests.length})</div>
      ${joinedQuests.length ? `<div style="display:flex;flex-direction:column;gap:.7rem">${joinedQuests.map(q=>renderQuestCard(q)).join('')}</div>` : `<div class="card" style="color:var(--ink-light);font-size:.85rem">Ainda não entraste em nenhuma quest.</div>`}
    </div>
    ${renderEditProfileModal()}
  </div>`;
}

function renderEditProfileModal() {
  const p = state.profile||{};
  return `<div class="modal-overlay hidden" id="edit-modal">
    <div class="modal-box">
      <div class="modal-title">EDITAR PERFIL</div>
      <div id="edit-error" class="auth-error hidden"></div>
      <div class="form-group">
        <label class="label-field">Nome</label>
        <input class="input" id="edit-name" value="${esc(p.name||'')}" placeholder="O teu nome">
      </div>
      <div class="form-group">
        <label class="label-field">Bio</label>
        <textarea class="input" id="edit-bio" placeholder="Fala sobre ti...">${esc(p.bio||'')}</textarea>
      </div>
      <div class="form-group">
        <label class="label-field">Género (opcional)</label>
        <select class="input" id="edit-gender">
          <option value="">Prefiro não dizer</option>
          <option value="m" ${p.gender==='m'?'selected':''}>Masculino</option>
          <option value="f" ${p.gender==='f'?'selected':''}>Feminino</option>
          <option value="nb" ${p.gender==='nb'?'selected':''}>Não-binário</option>
        </select>
      </div>
      <div class="form-group">
        <label class="label-field">Interesses</label>
        <div class="tag-list" id="edit-tags">
          ${TAGS.map(t=>`<button class="tag-select-btn ${(p.interests||[]).includes(t)?'selected':''}" data-tag="${t}" onclick="toggleInterest(this,'${t}')">${t}</button>`).join('')}
        </div>
      </div>
      <div style="display:flex;gap:.7rem">
        <button class="btn btn-primary" id="save-profile-btn" onclick="saveProfile()">Guardar</button>
        <button class="btn btn-ghost" onclick="closeEditModal()">Cancelar</button>
      </div>
    </div>
  </div>`;
}

let editInterests = [];
function toggleInterest(btn, tag) {
  if(editInterests.includes(tag)) {
    editInterests = editInterests.filter(t=>t!==tag);
    btn.classList.remove('selected');
  } else {
    editInterests.push(tag);
    btn.classList.add('selected');
  }
}

function openEditModal() {
  editInterests = [...(state.profile?.interests||[])];
  document.getElementById('edit-modal')?.classList.remove('hidden');
}
function closeEditModal() {
  document.getElementById('edit-modal')?.classList.add('hidden');
}

async function saveProfile() {
  const name = document.getElementById('edit-name')?.value.trim();
  const bio = document.getElementById('edit-bio')?.value.trim();
  const gender = document.getElementById('edit-gender')?.value;
  const errEl = document.getElementById('edit-error');
  if(!name) { errEl.textContent='Nome é obrigatório.'; errEl.classList.remove('hidden'); return; }
  try {
    const data = { name, bio: bio||'', gender: gender||null, interests: editInterests };
    await db.collection('users').doc(state.user.uid).set(data, {merge:true});
    state.profile = {...state.profile, ...data};
    closeEditModal();
    navigate('profile');
    showToast('Perfil guardado!');
  } catch(e) { errEl.textContent='Erro: '+e.message; errEl.classList.remove('hidden'); }
}

// Add edit profile button binding after rendering
const _renderPage = renderPage;
function renderPage() {
  const pc = document.getElementById('page-container');
  if(!pc) return;
  switch(state.currentPage) {
    case 'feed':    pc.innerHTML=renderFeedPage(); bindFeed(); break;
    case 'explore': pc.innerHTML=renderExplorePage(); bindExplore(); break;
    case 'create':  pc.innerHTML=renderCreatePage(); bindCreate(); break;
    case 'profile': 
      pc.innerHTML=renderProfilePage(); 
      document.querySelectorAll('.quest-card').forEach(card=>{
        card.addEventListener('click',()=>{
          const quest=state.quests.find(q=>q.id===card.dataset.id);
          if(quest) navigate('quest',quest);
        });
      });
      document.getElementById('edit-profile-btn')?.addEventListener('click', openEditModal);
      break;
    case 'quest':   pc.innerHTML=renderQuestDetail(); bindQuestDetail(); break;
  }
}

// ────────────────────────────────────────────────────────────
// AUTH PAGES
// ────────────────────────────────────────────────────────────
function renderAuth(app) {
  const isLogin = !window._showRegister;
  app.innerHTML = `<div class="auth-page">
    <div class="auth-box">
      <div class="auth-logo"><div class="nav-logo-dot"></div>SIDEQUEST</div>
      <div class="auth-sub">Experiências reais. Memórias reais. Sem algoritmo.</div>
      ${isLogin ? renderLoginForm() : renderRegisterForm()}
    </div>
  </div>`;
  bindAuthForms(isLogin);
}

function renderLoginForm() {
  return `<h2>ENTRAR</h2>
  <div id="auth-error" class="auth-error hidden"></div>
  <div class="form-group"><label class="label-field">Email</label><input class="input" id="auth-email" type="email" placeholder="email@exemplo.com" autocomplete="email"></div>
  <div class="form-group"><label class="label-field">Password</label><input class="input" id="auth-pass" type="password" placeholder="A tua password" autocomplete="current-password"></div>
  <button class="btn btn-primary btn-full" id="auth-btn">Entrar</button>
  <div class="auth-switch">Não tens conta? <a href="#" onclick="window._showRegister=true;renderAuth(document.getElementById('app'))">Regista-te</a></div>`;
}

function renderRegisterForm() {
  return `<h2>CRIAR CONTA</h2>
  <div id="auth-error" class="auth-error hidden"></div>
  <div class="form-group"><label class="label-field">Nome *</label><input class="input" id="auth-name" placeholder="O teu nome"></div>
  <div class="form-group"><label class="label-field">Email *</label><input class="input" id="auth-email" type="email" placeholder="email@exemplo.com" autocomplete="email"></div>
  <div class="form-group"><label class="label-field">Password *</label><input class="input" id="auth-pass" type="password" placeholder="Min. 6 caracteres" autocomplete="new-password"></div>
  <div class="form-group"><label class="label-field">Interesses (opcional)</label>
    <div class="tag-list" id="reg-tags">${TAGS.map(t=>`<button class="tag-select-btn" data-tag="${t}" type="button">${t}</button>`).join('')}</div>
  </div>
  <button class="btn btn-primary btn-full" id="auth-btn" style="margin-top:.5rem">Criar Conta</button>
  <div class="auth-switch">Já tens conta? <a href="#" onclick="window._showRegister=false;renderAuth(document.getElementById('app'))">Entrar</a></div>`;
}

let regInterests = [];
function bindAuthForms(isLogin) {
  regInterests = [];
  document.querySelectorAll('#reg-tags .tag-select-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const t=btn.dataset.tag;
      if(regInterests.includes(t)){regInterests=regInterests.filter(x=>x!==t);btn.classList.remove('selected');}
      else{regInterests.push(t);btn.classList.add('selected');}
    });
  });
  document.getElementById('auth-btn')?.addEventListener('click', isLogin?doLogin:doRegister);
  ['auth-email','auth-pass'].forEach(id=>{
    document.getElementById(id)?.addEventListener('keydown',e=>{if(e.key==='Enter'){isLogin?doLogin():doRegister();}});
  });
}

async function doLogin() {
  const email = document.getElementById('auth-email')?.value.trim();
  const pass = document.getElementById('auth-pass')?.value;
  const errEl = document.getElementById('auth-error');
  if(!email||!pass){errEl.textContent='Preenche todos os campos.';errEl.classList.remove('hidden');return;}
  const btn=document.getElementById('auth-btn');
  btn.disabled=true;btn.textContent='A entrar...';
  try {
    await auth.signInWithEmailAndPassword(email,pass);
  } catch(e) {
    const msgs={'auth/user-not-found':'Email não encontrado.','auth/wrong-password':'Password incorreta.','auth/invalid-email':'Email inválido.'};
    errEl.textContent=msgs[e.code]||e.message;errEl.classList.remove('hidden');
    btn.disabled=false;btn.textContent='Entrar';
  }
}

async function doRegister() {
  const name=document.getElementById('auth-name')?.value.trim();
  const email=document.getElementById('auth-email')?.value.trim();
  const pass=document.getElementById('auth-pass')?.value;
  const errEl=document.getElementById('auth-error');
  if(!name||!email||!pass){errEl.textContent='Preenche todos os campos.';errEl.classList.remove('hidden');return;}
  if(pass.length<6){errEl.textContent='Password com mínimo 6 caracteres.';errEl.classList.remove('hidden');return;}
  const btn=document.getElementById('auth-btn');
  btn.disabled=true;btn.textContent='A criar conta...';
  try {
    const cred=await auth.createUserWithEmailAndPassword(email,pass);
    await db.collection('users').doc(cred.user.uid).set({name,email,interests:regInterests,bio:'',gender:null,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    window._showRegister=false;
  } catch(e) {
    const msgs={'auth/email-already-in-use':'Email já em uso.','auth/invalid-email':'Email inválido.','auth/weak-password':'Password muito fraca.'};
    errEl.textContent=msgs[e.code]||e.message;errEl.classList.remove('hidden');
    btn.disabled=false;btn.textContent='Criar Conta';
  }
}

async function logout() {
  if(state.chatUnsub){state.chatUnsub();state.chatUnsub=null;}
  if(state.questsUnsub){state.questsUnsub();state.questsUnsub=null;}
  await auth.signOut();
}

// ────────────────────────────────────────────────────────────
// DATA LOADING
// ────────────────────────────────────────────────────────────
function loadQuests() {
  if(state.questsUnsub) state.questsUnsub();
  state.questsUnsub = db.collection('quests').orderBy('createdAt','desc').limit(100).onSnapshot(snap=>{
    state.quests = snap.docs.map(doc=>({id:doc.id,...doc.data()}));
    // Re-render if on feed/explore
    if(['feed','explore'].includes(state.currentPage)) {
      const pc=document.getElementById('page-container');
      if(pc){
        if(state.currentPage==='feed'){pc.innerHTML=renderFeedPage();bindFeed();}
        else{pc.innerHTML=renderExplorePage();bindExplore();}
      }
    }
  });
}

async function loadProfile(uid) {
  const doc = await db.collection('users').doc(uid).get();
  if(doc.exists) state.profile = doc.data();
  else state.profile = {name:'',bio:'',interests:[]};
}

// ────────────────────────────────────────────────────────────
// AUTH LISTENER — ENTRY POINT
// ────────────────────────────────────────────────────────────
auth.onAuthStateChanged(async user=>{
  state.user = user;
  if(user) {
    await loadProfile(user.uid);
    loadQuests();
    state.currentPage = 'feed';
    render();
  } else {
    if(state.questsUnsub){state.questsUnsub();state.questsUnsub=null;}
    state.quests=[];state.profile=null;state.activeQuest=null;
    render();
  }
});
</script>
</body>
</html>
