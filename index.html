<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- SECURITY: CSP restringe origens de scripts/ligações. 'unsafe-inline' é necessário porque a app é single-file com handlers inline; a proteção principal contra XSS é feita via escaping (esc/safeImg). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app; frame-src https://sidequest-8d699.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>SideQuest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
/* ══ THEME ══ */
:root,[data-theme="dark"]{
  --bg:#0d0f0b;--bg2:#111410;--surface:#161a13;--surface2:#1c211a;
  --border:#252b21;--border-strong:#2f3829;
  --green:#1a7a3c;--green-bright:#22c55e;--green-pale:#0f1f14;--green-mid:#1a3322;
  --silver:#4a5447;--silver-light:#3a4237;
  --ink:#e8ede4;--ink-mid:#b8c4b2;--ink-light:#7a8875;--red:#e74c3c;
  --xp:#f59e0b;--xp-pale:#1a1500;--xp-mid:#3d2e00;
  --nav-bg:rgba(13,15,11,.93);--bnav-bg:rgba(13,15,11,.97);
  --modal-overlay:rgba(0,0,0,.78);--shadow-card:rgba(0,0,0,.4);
  --font-display:'Bebas Neue',sans-serif;--font-body:'Outfit',sans-serif;--font-mono:'DM Mono',monospace;
  --radius:14px;--radius-sm:9px;
  --beta:#6366f1;--beta-pale:#3730a3;--beta-mid:#4f46e5;
}
/* ══ BETA BADGE ══ */
.beta-badge{display:inline-flex;align-items:center;gap:.4rem;background:var(--beta-pale);border:1px solid var(--beta-mid);border-radius:99px;padding:.3rem .8rem;font-family:var(--font-mono);font-size:.65rem;letter-spacing:1px;color:var(--beta);font-weight:700;text-transform:uppercase;}

[data-theme="light"]{
  --bg:#f4f6f2;--bg2:#eef0ec;--surface:#ffffff;--surface2:#f8faf7;
  --border:#dde3d8;--border-strong:#c4cebf;
  --green:#1a7a3c;--green-bright:#16a34a;--green-pale:#e8f5ed;--green-mid:#b4d9bf;
  --silver:#8a9488;--silver-light:#c8d4c2;
  --ink:#141a12;--ink-mid:#3a4438;--ink-light:#6b7868;--red:#c0392b;
  --xp:#d97706;--xp-pale:#fef9c3;--xp-mid:#fde68a;
  --nav-bg:rgba(244,246,242,.93);--bnav-bg:rgba(244,246,242,.97);
  --modal-overlay:rgba(0,0,0,.5);--shadow-card:rgba(0,0,0,.1);
  --beta:#6366f1;--beta-pale:#ede9fe;--beta-mid:#818cf8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow-x:hidden;min-height:100vh;transition:background .25s,color .25s;}
button{cursor:pointer;font-family:var(--font-body);}
input,textarea,select{font-family:var(--font-body);}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--bg2);}::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:2px;}
.hidden{display:none!important;}
#app{min-height:100vh;}
.page{min-height:100vh;padding-bottom:5rem;}

/* ══ NAV ══ */
.top-nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;justify-content:space-between;align-items:center;padding:.85rem 1.6rem;background:var(--nav-bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);transition:background .3s;}
.nav-logo{font-family:var(--font-display);font-size:1.4rem;letter-spacing:3px;color:var(--ink);display:flex;align-items:center;gap:.5rem;cursor:pointer;}
.nav-logo-dot{width:7px;height:7px;border-radius:50%;background:var(--green-bright);box-shadow:0 0 8px rgba(34,197,94,.5);animation:breathe 3s ease-in-out infinite;}
.nav-logo-socials{display:flex;gap:.35rem;margin-left:.4rem;align-items:center;}
.nav-social-btn{display:flex;align-items:center;justify-content:center;width:24px;height:24px;color:var(--ink-light);transition:all .2s;cursor:pointer;font-size:.9rem;}
.nav-social-btn:hover{color:var(--green-bright);}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.4);opacity:.6;}}
.nav-actions{display:flex;gap:.4rem;align-items:center;}
.nav-avatar{width:34px;height:34px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;cursor:pointer;border:2px solid var(--green-mid);flex-shrink:0;overflow:hidden;}
.nav-avatar img{width:100%;height:100%;object-fit:cover;}
.nav-link{font-size:.78rem;font-weight:600;color:var(--ink-light);padding:.38rem .75rem;border-radius:99px;transition:all .2s;cursor:pointer;white-space:nowrap;border:none;background:none;display:inline-flex;align-items:center;}
.nav-link:hover,.nav-link.active{color:var(--green-bright);background:var(--green-pale);}
.theme-toggle{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--ink-light);font-size:.95rem;transition:all .2s;flex-shrink:0;}
.theme-toggle:hover{border-color:var(--green-mid);color:var(--green-bright);background:var(--green-pale);}
.nav-msg-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--ink-light);transition:all .2s;flex-shrink:0;position:relative;}
.nav-msg-btn:hover{border-color:var(--green-mid);color:var(--green-bright);background:var(--green-pale);}
.nav-msg-badge{position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:var(--green-bright);color:#000;font-size:.55rem;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);}

/* ══ HAMBURGER MENU ══ */
.nav-hamburger{display:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);color:var(--ink-light);font-size:1.3rem;transition:all .2s;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;}
.nav-hamburger:hover{border-color:var(--green-mid);color:var(--green-bright);background:var(--green-pale);}
.nav-hamburger.open{border-color:var(--green);color:var(--green-bright);background:var(--green-pale);}

/* MENU SIDEBAR */
.menu-sidebar{position:fixed;left:0;top:0;width:280px;height:100vh;background:var(--surface);border-right:1px solid var(--border);z-index:300;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;}
.menu-sidebar.open{transform:translateX(0);}
.menu-sidebar-header{padding:1.3rem 1rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;margin-top:.3rem;}
.menu-sidebar-title{font-family:var(--font-display);font-size:1rem;letter-spacing:2px;color:var(--ink);font-weight:700;}
.menu-close-btn{width:32px;height:32px;border:none;background:none;color:var(--ink-light);font-size:1.4rem;cursor:pointer;transition:color .2s;display:flex;align-items:center;justify-content:center;}
.menu-close-btn:hover{color:var(--ink);}
.menu-sidebar-content{padding:0;}
.menu-section{padding:1.2rem 0;}
.menu-section-title{font-size:.7rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-light);padding:0 1.2rem 0.6rem;margin-bottom:0.4rem;}
.menu-item{padding:.75rem 1.2rem;color:var(--ink-light);font-size:.9rem;cursor:pointer;transition:all .2s;border-left:3px solid transparent;display:flex;align-items:center;gap:.6rem;border:none;background:none;width:100%;}
.menu-item:hover{color:var(--green-bright);background:var(--green-pale);border-left-color:var(--green);}
.menu-item.active{color:var(--green-bright);background:var(--green-pale);border-left-color:var(--green-bright);}
.menu-divider{height:1px;background:var(--border);margin:0.8rem 0;}

/* OVERLAY MENU */
.menu-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:250;backdrop-filter:blur(2px);}
.menu-overlay.open{display:block;}

/* ══ FEED ICON - CLEAN ══ */
.feed-icon{display:flex;flex-direction:column;gap:3px;width:22px;height:22px;justify-content:center;}
.feed-icon span{height:2px;background:currentColor;border-radius:1px;transition:all .2s;}

/* ══ BOTTOM NAV ══ */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--bnav-bg);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:.55rem .4rem;}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:.18rem;padding:.28rem .7rem;border-radius:var(--radius-sm);color:var(--ink-light);font-size:.58rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;transition:all .2s;background:none;border:none;}
.bnav-item svg{width:19px;height:19px;}
.bnav-item.active{color:var(--green-bright);background:var(--green-pale);}

/* ══ FORMS ══ */
.input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:.8rem 1rem;color:var(--ink);font-size:.9rem;outline:none;transition:border-color .2s,box-shadow .2s;}
.input::placeholder{color:var(--silver);}
.input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(26,122,60,.15);}
textarea.input{resize:vertical;min-height:90px;max-height:200px;}
.label-field{font-size:.78rem;font-weight:600;color:var(--ink-mid);margin-bottom:.4rem;letter-spacing:.5px;}
.form-group{display:flex;flex-direction:column;margin-bottom:1.1rem;}
.img-upload-area{border:2px dashed var(--border-strong);border-radius:var(--radius);padding:2rem;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface2);position:relative;}
.img-upload-area:hover{border-color:var(--green);background:var(--green-pale);}
.img-upload-area.has-img{padding:0;overflow:hidden;border-style:solid;border-color:var(--green-mid);}
.img-upload-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;border-radius:calc(var(--radius) - 2px);}
.img-upload-area:hover .img-upload-overlay{opacity:1;}
input[type="file"]{display:none;}

/* ══ BUTTONS ══ */
.btn{border:none;border-radius:var(--radius-sm);padding:.75rem 1.4rem;font-size:.85rem;font-weight:700;transition:all .2s;letter-spacing:.3px;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:#145f2e;transform:translateY(-1px);box-shadow:0 6px 24px rgba(26,122,60,.3);}
.btn-primary:disabled{background:var(--silver-light);color:var(--ink-light);cursor:not-allowed;transform:none;box-shadow:none;}
.btn-secondary{background:var(--surface2);color:var(--ink);border:1px solid var(--border-strong);}
.btn-secondary:hover{border-color:var(--green-mid);background:var(--green-pale);}
.btn-ghost{background:none;color:var(--ink-light);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--ink);border-color:var(--border-strong);}
.btn-danger{background:rgba(231,76,60,.1);color:var(--red);border:1px solid rgba(231,76,60,.2);}
.btn-danger:hover{background:rgba(231,76,60,.2);}
.btn-sm{padding:.38rem .85rem;font-size:.78rem;}
.btn-full{width:100%;}
.btn-icon{display:inline-flex;align-items:center;gap:.5rem;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem 1.4rem;}

/* ══ AUTH ══ */
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--bg);}
.auth-box{width:100%;max-width:420px;}
.auth-logo{font-family:var(--font-display);font-size:2.5rem;letter-spacing:4px;color:var(--ink);margin-bottom:.3rem;display:flex;align-items:center;gap:.6rem;}
.auth-sub{font-size:.88rem;color:var(--ink-light);margin-bottom:2.5rem;line-height:1.6;}
.auth-box h2{font-family:var(--font-display);font-size:1.8rem;letter-spacing:2px;margin-bottom:1.8rem;color:var(--ink);}
.auth-switch{text-align:center;margin-top:1.5rem;font-size:.84rem;color:var(--ink-light);}
.auth-switch a{color:var(--green-bright);font-weight:600;}
.auth-error{background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.3);color:#e57373;font-size:.82rem;padding:.7rem 1rem;border-radius:var(--radius-sm);margin-bottom:1rem;}

/* ══ TAGS ══ */
.tag{display:inline-flex;align-items:center;gap:.3rem;font-family:var(--font-mono);font-size:.63rem;letter-spacing:1.5px;text-transform:uppercase;padding:.28rem .65rem;border-radius:99px;background:var(--green-pale);color:var(--green-bright);border:1px solid var(--green-mid);}
.tag-list{display:flex;flex-wrap:wrap;gap:.4rem;}
.tag-select-btn{font-family:var(--font-mono);font-size:.63rem;letter-spacing:1px;text-transform:uppercase;padding:.32rem .78rem;border-radius:99px;background:var(--surface2);border:1px solid var(--border);color:var(--ink-light);cursor:pointer;transition:all .2s;}
.tag-select-btn.selected{background:var(--green-pale);border-color:var(--green-mid);color:var(--green-bright);}

/* ══ XP / LEVEL SYSTEM ══ */
.xp-bar-wrap{background:var(--surface2);border:1px solid var(--border);border-radius:99px;height:8px;overflow:hidden;}
.xp-bar-fill{height:100%;background:linear-gradient(90deg,var(--xp),#fbbf24);border-radius:99px;transition:width .6s ease;}
.level-badge{display:inline-flex;align-items:center;gap:.4rem;background:var(--xp-pale);border:1px solid var(--xp-mid);border-radius:99px;padding:.3rem .8rem;font-family:var(--font-mono);font-size:.65rem;letter-spacing:1px;color:var(--xp);}
.frame-none{/* default — just the border color */}
.frame-bronze{box-shadow:0 0 0 3px #cd7f32!important;}
.frame-silver{box-shadow:0 0 0 3px #a8a9ad!important;}
.frame-gold{box-shadow:0 0 0 3px #ffd700!important;}
.frame-emerald{box-shadow:0 0 0 3px #50c878,0 0 16px rgba(80,200,120,.4)!important;}
.frame-diamond{box-shadow:0 0 0 3px #b9f2ff,0 0 20px rgba(185,242,255,.5)!important;}
.frame-legend{box-shadow:0 0 0 3px var(--green-bright),0 0 24px rgba(34,197,94,.6)!important;animation:legendPulse 2s infinite;}
@keyframes legendPulse{0%,100%{box-shadow:0 0 0 3px var(--green-bright),0 0 24px rgba(34,197,94,.6);}50%{box-shadow:0 0 0 4px var(--green-bright),0 0 36px rgba(34,197,94,.8);}}

/* ══ QUEST CARD ══ */
.quest-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .25s;cursor:pointer;display:flex;flex-direction:column;}
.quest-card:hover{border-color:var(--green-mid);box-shadow:0 8px 32px var(--shadow-card);transform:translateY(-2px);}
.quest-card-img{width:100%;height:160px;object-fit:cover;display:block;}
.quest-card-img-placeholder{width:100%;height:120px;background:linear-gradient(135deg,var(--surface2) 0%,var(--green-pale) 100%);display:flex;align-items:center;justify-content:center;font-size:2.5rem;}
.quest-card-header{padding:1rem 1.2rem .75rem;border-bottom:1px solid var(--border);}
.quest-category-label{font-family:var(--font-mono);font-size:.58rem;letter-spacing:3px;text-transform:uppercase;color:var(--green-bright);margin-bottom:.45rem;display:flex;align-items:center;gap:.4rem;}
.quest-dot{width:5px;height:5px;border-radius:50%;background:var(--green-bright);}
.quest-title{font-family:var(--font-display);font-size:1.3rem;letter-spacing:1px;line-height:1.1;color:var(--ink);margin-bottom:.45rem;}
.quest-desc{font-size:.8rem;color:var(--ink-light);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.quest-card-meta{padding:.7rem 1.2rem;display:flex;gap:1rem;flex-wrap:wrap;}
.quest-meta-item{display:flex;align-items:center;gap:.35rem;font-size:.73rem;color:var(--ink-light);font-family:var(--font-mono);}
.quest-card-footer{padding:.75rem 1.2rem;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);margin-top:auto;}
.avatar-stack{display:flex;}
.avatar-sm{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:700;color:#fff;margin-left:-6px;flex-shrink:0;overflow:hidden;cursor:pointer;transition:transform .2s;}
.avatar-sm:hover{transform:scale(1.1);}

/* ══ EXPIRED QUEST BADGE ══ */
.expired-badge{display:inline-flex;align-items:center;gap:.4rem;background:rgba(231,76,60,.1);color:var(--red);padding:.3rem .8rem;border-radius:99px;font-size:.7rem;font-weight:600;margin-bottom:.6rem;}

/* ══ PARTICIPANT CHECKBOX ══ */
.participant-item{display:flex;align-items:center;gap:.8rem;padding:.8rem;background:var(--surface2);border-radius:var(--radius-sm);margin-bottom:.6rem;border:1px solid var(--border);}
.participant-item input[type="checkbox"]{width:18px;height:18px;cursor:pointer;accent-color:var(--green-bright);}
.participant-info{flex:1;}
.participant-name{font-weight:600;color:var(--ink);}
.participant-email{font-size:.78rem;color:var(--ink-light);}
.avatar-sm:first-child{margin-left:0;}
.avatar-sm img{width:100%;height:100%;object-fit:cover;}
.spots-label{font-size:.7rem;color:var(--ink-light);font-family:var(--font-mono);margin-left:.55rem;}

/* ══ FEED ══ */
.feed-page{padding-top:4.5rem;}

/* ── Hero Banner (collage) ── */
.feed-hero{position:relative;overflow:hidden;height:clamp(280px,46vw,460px);border-bottom:1px solid var(--border);}
.hero-collage{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;grid-template-rows:1fr;gap:2px;}
.hero-collage-img{width:100%;height:100%;object-fit:cover;object-position:center 40%;transition:transform 8s ease-out;transform:scale(1.04);}
.hero-collage-img.loaded{transform:scale(1);}
.feed-hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88) 0%,rgba(0,0,0,.5) 40%,rgba(0,0,0,.2) 100%),linear-gradient(to right,rgba(0,0,0,.5) 0%,transparent 60%);}
.feed-hero-inner{position:absolute;bottom:0;left:0;right:0;z-index:2;padding:2rem 1.5rem 1.8rem;max-width:680px;}
.feed-hero-title{font-family:var(--font-display);font-size:clamp(2.4rem,6.5vw,4.4rem);letter-spacing:2px;line-height:.93;color:#fff;margin-bottom:.9rem;text-shadow:0 2px 24px rgba(0,0,0,.5);}
.feed-hero-title .green{color:var(--green-bright);}
.feed-hero-sub{font-size:.88rem;color:rgba(255,255,255,.75);line-height:1.72;max-width:440px;margin-bottom:1.3rem;font-style:italic;}
.feed-hero-cta{display:inline-flex;align-items:center;gap:.55rem;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);padding:.72rem 1.4rem;font-family:var(--font-body);font-size:.85rem;font-weight:700;letter-spacing:.3px;cursor:pointer;transition:all .2s;box-shadow:0 4px 20px rgba(34,197,94,.3);}
.feed-hero-cta:hover{background:#145f2e;transform:translateY(-1px);box-shadow:0 8px 28px rgba(34,197,94,.4);}

.feed-section-label{padding:1.2rem 1.3rem .4rem;display:flex;align-items:center;gap:.6rem;font-family:var(--font-mono);font-size:.65rem;letter-spacing:3px;text-transform:uppercase;color:var(--green);}
.feed-section-label::before{content:'';width:14px;height:1.5px;background:var(--green);}
.feed-filters{padding:.3rem 1.2rem .8rem;display:flex;gap:.45rem;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;}
.feed-filters::-webkit-scrollbar{display:none;}
.filter-btn{font-family:var(--font-mono);font-size:.63rem;letter-spacing:2px;text-transform:uppercase;padding:.38rem .95rem;border-radius:99px;background:var(--surface2);border:1px solid var(--border);color:var(--ink-light);white-space:nowrap;transition:all .2s;}
.filter-btn.active{background:var(--green-pale);border-color:var(--green-mid);color:var(--green-bright);}
.feed-grid{padding:0 1rem 1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1rem;}
.feed-empty{text-align:center;padding:4rem 2rem;color:var(--ink-light);}
.feed-empty .big{font-family:var(--font-display);font-size:3rem;letter-spacing:2px;color:var(--border-strong);}
.fab{position:fixed;bottom:5rem;right:1.2rem;z-index:100;width:52px;height:52px;border-radius:50%;background:var(--green);border:none;color:#fff;font-size:1.6rem;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(34,197,94,.3);transition:all .2s;}
.fab:hover{background:#145f2e;transform:scale(1.1);}

/* ══ GALLERY - MASONRY LAYOUT ══ */
.gallery-page{padding-top:4.5rem;}
.gallery-grid{column-count:3;column-gap:1rem;padding:1rem;}
@media(max-width:1024px){.gallery-grid{column-count:2;}}
@media(max-width:640px){.gallery-grid{column-count:1;}}
.gallery-item{break-inside:avoid;margin-bottom:1rem;position:relative;border-radius:var(--radius);overflow:hidden;cursor:pointer;border:2px solid var(--border);transition:all .2s;}
.gallery-item:hover{border-color:var(--green-mid);box-shadow:0 6px 24px var(--shadow-card);}
.gallery-item-img{width:100%;height:auto;display:block;}
.gallery-item-overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .2s;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.9rem;font-weight:600;gap:1rem;}
.gallery-item:hover .gallery-item-overlay{opacity:1;}
.gallery-delete-btn{background:rgba(231,76,60,.8);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;transition:all .2s;}
.gallery-delete-btn:hover{background:var(--red);transform:scale(1.1);}

/* ══ QUEST DETAIL ══ */
.detail-page{padding-top:4.5rem;max-width:700px;margin:0 auto;padding-left:1rem;padding-right:1rem;}
.detail-back{display:flex;align-items:center;gap:.5rem;color:var(--ink-light);font-size:.82rem;padding:1rem 0;cursor:pointer;transition:color .2s;border:none;background:none;}
.detail-back:hover{color:var(--green-bright);}
.detail-cover{width:100%;height:220px;object-fit:cover;border-radius:var(--radius);margin-bottom:1.2rem;border:1px solid var(--border);}
.detail-cover-placeholder{width:100%;height:160px;border-radius:var(--radius);margin-bottom:1.2rem;background:linear-gradient(135deg,var(--surface2) 0%,var(--green-pale) 100%);display:flex;align-items:center;justify-content:center;font-size:3rem;border:1px solid var(--border);}
.detail-title{font-family:var(--font-display);font-size:clamp(2rem,6vw,3rem);letter-spacing:2px;line-height:1.05;color:var(--ink);margin-bottom:.8rem;}
.detail-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:1.2rem 0;}
.detail-meta-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.8rem 1rem;}
.detail-meta-card .mlabel{font-family:var(--font-mono);font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--ink-light);margin-bottom:.2rem;}
.detail-meta-card .mval{font-size:.88rem;font-weight:600;color:var(--ink);}
.detail-desc{font-size:.9rem;color:var(--ink-mid);line-height:1.8;margin:1.2rem 0;}
.members-section{margin:1.5rem 0;}
.section-label{font-family:var(--font-mono);font-size:.63rem;letter-spacing:3px;text-transform:uppercase;color:var(--green);margin-bottom:1rem;display:flex;align-items:center;gap:.6rem;}
.section-label::before{content:'';width:14px;height:1.5px;background:var(--green);}
.member-list{display:flex;flex-direction:column;gap:.55rem;}
.member-item{display:flex;align-items:center;gap:.8rem;padding:.65rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;}
.member-item:hover{border-color:var(--green-mid);background:var(--green-pale);}
.member-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;}
.member-avatar img{width:100%;height:100%;object-fit:cover;}
.creator-badge{font-family:var(--font-mono);font-size:.56rem;letter-spacing:1px;text-transform:uppercase;background:var(--green-pale);color:var(--green-bright);border:1px solid var(--green-mid);padding:.18rem .5rem;border-radius:99px;margin-left:auto;}

/* ══ CHAT ══ */
.chat-section{margin:1.5rem 0;}
.chat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;height:360px;}
.chat-messages{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.6rem;}
.chat-msg{display:flex;gap:.6rem;align-items:flex-start;}
.chat-msg.own{flex-direction:row-reverse;}
.chat-avatar{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.58rem;font-weight:700;color:#fff;flex-shrink:0;margin-top:.1rem;overflow:hidden;}
.chat-bubble{max-width:75%;padding:.58rem .88rem;border-radius:12px;font-size:.82rem;line-height:1.5;}
.chat-msg:not(.own) .chat-bubble{background:var(--surface2);border:1px solid var(--border);color:var(--ink);border-radius:2px 12px 12px 12px;}
.chat-msg.own .chat-bubble{background:var(--green);color:#fff;border-radius:12px 2px 12px 12px;}
.chat-name{font-size:.6rem;color:var(--ink-light);font-family:var(--font-mono);margin-bottom:.18rem;}
.chat-time{font-size:.58rem;color:var(--ink-light);margin-top:.18rem;}
.chat-input-row{display:flex;gap:.5rem;padding:.75rem 1rem;border-top:1px solid var(--border);background:var(--surface2);}
.chat-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:.52rem 1rem;color:var(--ink);font-size:.82rem;outline:none;}
.chat-input:focus{border-color:var(--green-mid);}
.chat-send{background:var(--green);border:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.chat-send:hover{background:#145f2e;}
.chat-locked{padding:2rem;text-align:center;color:var(--ink-light);font-size:.83rem;}

/* ══ CREATE ══ */
.create-page{padding-top:4.5rem;max-width:600px;margin:0 auto;padding-left:1rem;padding-right:1rem;}
.create-header{padding:1.5rem 0 .5rem;}

/* ══ PROFILE (LORE - REDESENHADO) ══ */
.profile-page{padding-top:4.5rem;max-width:800px;margin:0 auto;padding-left:1rem;padding-right:1rem;}
.profile-banner{position:relative;width:100%;height:160px;border-radius:var(--radius);overflow:hidden;margin-bottom:0;background:linear-gradient(135deg,var(--green-pale),var(--surface2));}
.profile-banner img{width:100%;height:100%;object-fit:cover;}
.profile-banner-default{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3rem;}
.profile-banner-lock{position:absolute;bottom:.6rem;right:.7rem;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);border-radius:99px;padding:.25rem .7rem;font-size:.62rem;color:rgba(255,255,255,.6);font-family:var(--font-mono);letter-spacing:1px;display:flex;align-items:center;gap:.3rem;}
.profile-avatar-row{display:flex;align-items:flex-end;gap:1rem;padding:0 1rem;margin-top:-32px;margin-bottom:.8rem;position:relative;z-index:2;}
.profile-avatar-big{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;border:3px solid var(--bg);}
.profile-avatar-big img{width:100%;height:100%;object-fit:cover;}
.profile-name{font-family:var(--font-display);font-size:1.8rem;letter-spacing:2px;line-height:1;}
.profile-bio{font-size:.84rem;color:var(--ink-light);margin-top:.4rem;line-height:1.6;word-wrap:break-word;overflow-wrap:break-word;max-width:100%;}
.profile-xp-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem 1.4rem;margin:1rem 0;}
.profile-xp-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;}
.quests-section{margin:1.5rem 0;}

/* ══════════════════════════════════════════════════════════════
   LORE — O LIVRO DA TUA VIDA (REDESENHADO)
   ══════════════════════════════════════════════════════════════ */
.lore-page{padding-top:4.5rem;max-width:720px;margin:0 auto;padding-left:1rem;padding-right:1rem;}
.lore-reveal{animation:loreUp .6s cubic-bezier(.2,.7,.2,1) both;}
.lore-reveal-2{animation:loreUp .6s cubic-bezier(.2,.7,.2,1) .06s both;}
.lore-reveal-3{animation:loreUp .6s cubic-bezier(.2,.7,.2,1) .12s both;}
@keyframes loreUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

/* banner + identidade */
.lore-banner{position:relative;width:100%;height:150px;border-radius:var(--radius);overflow:hidden;background:linear-gradient(135deg,#0a0c08,var(--surface));margin-top:1rem;}
.lore-banner img{width:100%;height:100%;object-fit:cover;}
.lore-banner-default{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;opacity:.5;}
.lore-banner-lock{position:absolute;bottom:.6rem;right:.7rem;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);border-radius:99px;padding:.25rem .7rem;font-size:.6rem;color:rgba(255,255,255,.55);font-family:var(--font-mono);letter-spacing:1px;}
.lore-id-row{display:flex;align-items:flex-end;gap:1rem;padding:0 .4rem;margin-top:-34px;position:relative;z-index:2;}
.lore-avatar{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;border:3px solid var(--bg);cursor:pointer;}
.lore-avatar img{width:100%;height:100%;object-fit:cover;}
.lore-cam{position:absolute;bottom:0;right:0;width:24px;height:24px;border-radius:50%;background:var(--green);border:2px solid var(--bg);display:flex;align-items:center;justify-content:center;pointer-events:none;}
.lore-name{font-family:var(--font-display);font-size:2rem;letter-spacing:2px;line-height:.95;color:var(--ink);}
.lore-chapter-tag{display:block;margin-top:.5rem;font-family:var(--font-mono);font-size:.66rem;letter-spacing:2px;line-height:1.5;text-transform:uppercase;color:var(--ink-light);}
.lore-chapter-tag b{color:var(--ink-mid);font-weight:500;}
.lore-bio{font-size:.86rem;color:var(--ink-light);line-height:1.65;margin:.9rem .4rem 0;}

/* XP subtil - barra simples */
.lore-xp-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.75rem 1rem;margin:1rem 0;display:flex;align-items:center;gap:1rem;}
.lore-xp-bar-content{flex:1;}
.lore-xp-bar-top{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--font-mono);font-size:.62rem;letter-spacing:1px;color:var(--ink-light);margin-bottom:.5rem;}
.lore-xp-bar-top b{color:var(--ink);}
.lore-xp-bar-level{font-family:var(--font-display);font-size:2.2rem;letter-spacing:1px;color:var(--green-bright);line-height:1;}

/* Action buttons (editar, tema, sair) */
.lore-action-buttons{display:flex;gap:.6rem;flex-wrap:wrap;margin:1rem 0;}

/* eyebrow / labels de secção */
.lore-eyebrow{font-family:var(--font-mono);font-size:.62rem;letter-spacing:3px;text-transform:uppercase;color:var(--ink-light);display:flex;align-items:center;gap:.6rem;}
.lore-eyebrow::before{content:'';width:16px;height:1px;background:var(--border-strong);}
.lore-section{margin-top:2.4rem;}
.lore-section > .lore-eyebrow{margin-bottom:1rem;}

/* HERO — O TEU LORE com stats HORIZONTAIS */
.lore-hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.6rem 1.5rem 1.3rem;margin-top:1.4rem;position:relative;overflow:hidden;}
.lore-hero::after{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:linear-gradient(var(--green-bright),transparent);opacity:.5;}
.lore-hero-title{font-family:var(--font-mono);font-size:.62rem;letter-spacing:4px;text-transform:uppercase;color:var(--green-bright);margin-bottom:1.1rem;}
.lore-stats{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin-bottom:1.2rem;}
@media(min-width:600px){.lore-stats{grid-template-columns:repeat(4,1fr);}}
.lore-stat{display:flex;flex-direction:column;text-align:center;}
.lore-stat-num{font-family:var(--font-display);font-size:2.2rem;letter-spacing:1px;color:var(--green-bright);line-height:1;}
.lore-stat-label{font-size:.72rem;color:var(--ink-light);margin-top:.4rem;line-height:1.3;}
.lore-firsts{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.8rem;padding-top:1rem;border-top:1px solid var(--border);}
.lore-first-chip{font-size:.74rem;color:var(--ink-mid);background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:.32rem .7rem;display:inline-flex;gap:.35rem;align-items:center;}

/* share */
.lore-share{width:100%;margin-top:1rem;display:flex;align-items:center;justify-content:center;gap:.6rem;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);padding:.95rem;font-weight:700;font-size:.9rem;letter-spacing:.3px;transition:all .2s;}
.lore-share:hover{background:#157032;transform:translateY(-1px);box-shadow:0 8px 26px rgba(26,122,60,.3);}

/* card genérico */
.lore-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.3rem 1.4rem;}

/* AINDA QUERO VIVER — bucket list */
.lore-bucket{display:flex;flex-direction:column;gap:.1rem;}
.lore-bucket .lore-goal-auto{margin-left:auto;font-family:var(--font-mono);font-size:.55rem;letter-spacing:1px;color:var(--green-bright);background:var(--green-pale);border:1px solid var(--green-mid);border-radius:99px;padding:.12rem .45rem;text-transform:uppercase;}
.lore-bucket-del{margin-left:auto;background:none;border:none;color:var(--silver);font-size:1rem;cursor:pointer;opacity:0;transition:opacity .2s;padding:0 .2rem;line-height:1;}
.lore-goal:hover .lore-bucket-del{opacity:1;}
.lore-bucket-add{display:flex;gap:.6rem;margin-top:1rem;}
.lore-bucket-add input{flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:.7rem .9rem;color:var(--ink);font-size:.86rem;outline:none;}
.lore-bucket-add input:focus{border-color:var(--green);}
.lore-bucket-add button{background:var(--surface2);border:1px solid var(--border-strong);color:var(--ink);border-radius:var(--radius-sm);width:44px;font-size:1.3rem;line-height:1;flex-shrink:0;transition:all .2s;}
.lore-bucket-add button:hover{border-color:var(--green-mid);background:var(--green-pale);color:var(--green-bright);}
.lore-goal{display:flex;align-items:center;gap:.75rem;padding:.65rem .1rem;cursor:pointer;}
.lore-goal:not(:last-child){border-bottom:1px solid var(--border);}
.lore-tick{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;color:transparent;}
.lore-goal.done .lore-tick{background:var(--green);border-color:var(--green);color:#fff;}
.lore-goal-text{font-size:.9rem;color:var(--ink-mid);}
.lore-goal.done .lore-goal-text{color:var(--ink-light);text-decoration:line-through;text-decoration-color:var(--silver-light);}

/* LINHA TEMPORAL — o fio da história */
.lore-timeline{position:relative;padding-left:1.7rem;}
.lore-timeline::before{content:'';position:absolute;left:6px;top:6px;bottom:18px;width:1.5px;background:linear-gradient(var(--border-strong),var(--border-strong) 70%,transparent);}
.lore-tl-node{position:relative;padding-bottom:1.7rem;}
.lore-tl-node:last-child{padding-bottom:0;}
.lore-tl-dot{position:absolute;left:-1.7rem;top:3px;width:13px;height:13px;border-radius:50%;background:var(--bg);border:2px solid var(--silver-light);}
.lore-tl-node.first .lore-tl-dot{border-color:var(--green-bright);background:var(--green-pale);}
.lore-tl-node.now .lore-tl-dot{border-color:var(--green-bright);background:var(--green-bright);box-shadow:0 0 0 4px rgba(34,197,94,.18);animation:loreNow 2.4s ease-in-out infinite;}
@keyframes loreNow{0%,100%{box-shadow:0 0 0 4px rgba(34,197,94,.18);}50%{box-shadow:0 0 0 7px rgba(34,197,94,.05);}}
.lore-tl-month{font-family:var(--font-mono);font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--ink-light);margin-bottom:.25rem;}
.lore-tl-title{font-size:.96rem;font-weight:700;color:var(--ink);line-height:1.2;}
.lore-tl-title .lore-tl-emoji{margin-right:.4rem;}
.lore-tl-cap{font-size:.78rem;color:var(--ink-light);margin-top:.2rem;line-height:1.5;}
.lore-tl-cap .lore-tl-place{color:var(--ink-mid);}
.lore-tl-first-tag{display:inline-block;margin-top:.35rem;font-family:var(--font-mono);font-size:.55rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--green-bright);}

/* PESSOAS DA TUA HISTÓRIA — HORIZONTAL */
.lore-people-container{display:flex;gap:1rem;overflow-x:auto;padding-bottom:.5rem;margin-bottom:1rem;}
.lore-people-container::-webkit-scrollbar{height:4px;}
.lore-people-container::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:2px;}
.lore-person{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:90px;cursor:pointer;padding:.8rem .6rem;border-radius:var(--radius-sm);transition:background .2s;flex-shrink:0;}
.lore-person:hover{background:var(--green-pale);}
.lore-person-av{width:50px;height:50px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1rem;overflow:hidden;margin-bottom:.5rem;}
.lore-person-av img{width:100%;height:100%;object-fit:cover;}
.lore-person-name{font-size:.82rem;font-weight:600;color:var(--ink);margin-bottom:.2rem;word-break:break-word;}
.lore-person-meta{font-size:.65rem;color:var(--ink-light);font-family:var(--font-mono);}
.lore-person-count{font-family:var(--font-display);font-size:1.2rem;letter-spacing:1px;color:var(--green-bright);margin-top:.3rem;}

/* MEMÓRIAS (badges) */
.lore-badges{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}
.lore-badge{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:1.1rem 1rem;}
.lore-badge-emoji{font-size:1.6rem;line-height:1;}
.lore-badge-name{font-family:var(--font-display);font-size:1.05rem;letter-spacing:1px;color:var(--ink);margin-top:.5rem;}
.lore-badge-desc{font-size:.74rem;color:var(--ink-light);line-height:1.5;margin-top:.3rem;}
.lore-badge-date{font-family:var(--font-mono);font-size:.55rem;letter-spacing:1px;color:var(--silver);margin-top:.5rem;}
.lore-badge.locked{opacity:.45;}
.lore-badge.locked .lore-badge-emoji{filter:grayscale(1);}

/* empty states */
.lore-empty{font-size:.86rem;color:var(--ink-light);line-height:1.65;padding:.2rem .1rem;}
.lore-empty b{color:var(--ink-mid);font-weight:600;}

/* utilitários */
.lore-utils{margin-top:2.6rem;padding-top:1.4rem;border-top:1px solid var(--border);}
.lore-utils-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.9rem;}

/* share modal */
.lore-share-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:600;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.2rem;gap:1rem;}
.lore-share-modal img{max-width:min(360px,80vw);max-height:64vh;border-radius:16px;border:1px solid var(--border-strong);box-shadow:0 20px 60px rgba(0,0,0,.6);}
.lore-share-actions{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;}

/* ══ MESSAGES PAGE ══ */
.messages-page{padding-top:4.5rem;max-width:680px;margin:0 auto;padding-left:1rem;padding-right:1rem;}
.msg-thread{display:flex;gap:.8rem;align-items:flex-start;padding:1rem 1.1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;}
.msg-thread:hover{border-color:var(--green-mid);}
.msg-thread-icon{width:40px;height:40px;border-radius:50%;background:var(--green-pale);border:1px solid var(--green-mid);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.msg-thread-title{font-size:.9rem;font-weight:700;color:var(--ink);}
.msg-thread-preview{font-size:.78rem;color:var(--ink-light);margin-top:.15rem;}
.msg-thread-time{font-family:var(--font-mono);font-size:.6rem;color:var(--ink-light);margin-left:auto;white-space:nowrap;}

/* ══ FOOTER ÉPICO ══ */
.footer-container{background:var(--bg);border-top:1px solid var(--border)}
.footer-thinking{background:linear-gradient(135deg,var(--green-pale) 0%,var(--surface2) 100%);border-bottom:1px solid var(--border);padding:3.5rem 1.5rem;text-align:center}
.footer-thinking-quote{font-family:var(--font-display);font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:1px;line-height:1.2;color:var(--ink);margin-bottom:1rem;max-width:700px;margin-left:auto;margin-right:auto}
.footer-thinking-sub{font-size:.95rem;color:var(--ink-light);max-width:600px;margin:0 auto;line-height:1.7}
.footer-content{max-width:1200px;margin:0 auto;padding:3rem 1.5rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:2.5rem}
.footer-section{display:flex;flex-direction:column}
.footer-section-title{font-family:var(--font-display);font-size:1.1rem;letter-spacing:2px;color:var(--ink);margin-bottom:1.3rem;text-transform:uppercase}
.footer-section-title::before{content:'';display:inline-block;width:3px;height:18px;background:var(--green-bright);margin-right:.6rem}
.footer-link{color:var(--ink-light);text-decoration:none;font-size:.88rem;margin-bottom:.75rem;transition:all .2s;display:flex;align-items:center;gap:.4rem;cursor:pointer}
.footer-link:hover{color:var(--green-bright);transform:translateX(4px)}
.footer-manifesto{background:var(--surface);border-left:3px solid var(--green-bright);padding:1.5rem;margin-bottom:1rem;border-radius:var(--radius-sm)}
.footer-manifesto-title{font-family:var(--font-display);font-size:1.2rem;letter-spacing:1px;color:var(--ink);margin-bottom:.8rem}
.footer-manifesto-text{font-size:.85rem;color:var(--ink-mid);line-height:1.8}
.footer-social-heading{font-size:.88rem;color:var(--ink-light);margin-bottom:1.2rem;line-height:1.6}
.footer-social-icons{display:flex;gap:1rem;margin-top:1.2rem}
.footer-social-icon{width:40px;height:40px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink-light);transition:all .2s;cursor:pointer;text-decoration:none;font-size:1rem}
.footer-social-icon:hover{border-color:var(--green);background:var(--green-pale);color:var(--green-bright);transform:translateY(-3px)}
.footer-stats{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:2rem 1.5rem;margin:2.5rem 1.5rem 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2rem;text-align:center}
.footer-stat{display:flex;flex-direction:column}
.footer-stat-number{font-family:var(--font-display);font-size:2.2rem;letter-spacing:1px;color:var(--green-bright);margin-bottom:.4rem}
.footer-stat-label{font-size:.8rem;color:var(--ink-light);font-family:var(--font-mono);letter-spacing:1px;text-transform:uppercase}
.footer-cta-section{background:var(--surface);border-top:1px solid var(--border);padding:4rem 1.5rem;text-align:center;margin-top:2rem}
.footer-cta-title{font-family:var(--font-display);font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:2px;color:var(--ink);margin-bottom:1rem;line-height:1.1}
.footer-cta-subtitle{font-size:.95rem;color:var(--ink-light);max-width:600px;margin:0 auto 2rem;line-height:1.7}
.footer-cta-btn{display:inline-flex;align-items:center;gap:.6rem;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);padding:.9rem 2rem;font-family:var(--font-body);font-size:.9rem;font-weight:700;letter-spacing:.3px;cursor:pointer;transition:all .2s;box-shadow:0 8px 24px rgba(26,122,60,.3)}
.footer-cta-btn:hover{background:#145f2e;transform:translateY(-2px);box-shadow:0 12px 32px rgba(26,122,60,.4)}
.footer-bottom{background:var(--bg);border-top:1px solid var(--border);padding:2rem 1.5rem;text-align:center;font-size:.78rem;color:var(--ink-light)}
.footer-bottom-content{max-width:1200px;margin:0 auto;display:flex;justify-content:center;align-items:center;gap:2rem;flex-wrap:wrap}
.footer-bottom-brand{display:flex;align-items:center;gap:.8rem;font-weight:600;color:var(--ink)}
.footer-bottom-brand-dot{width:6px;height:6px;border-radius:50%;background:var(--green-bright)}
.footer-bottom-tagline{font-size:.75rem;color:var(--ink-light);font-style:italic}
.footer-bottom-links{display:flex;gap:1.5rem}
.footer-bottom-link{color:var(--ink-light);text-decoration:none;font-size:.75rem;transition:color .2s;cursor:pointer}
.footer-bottom-link:hover{color:var(--green-bright)}

@media(max-width:768px){
  .footer-content{grid-template-columns:1fr;gap:2rem}
  .footer-thinking{padding:2.5rem 1rem}
  .footer-thinking-quote{font-size:1.8rem}
  .footer-stats{margin:2rem 0}
  .footer-cta-section{padding:2.5rem 1rem}
  .footer-bottom-content{flex-direction:column;gap:1rem}
  .footer-bottom-links{flex-direction:column;gap:.8rem;text-align:center}
}

/* ══ STATIC PAGES ══ */
.static-page{padding-top:4.5rem;max-width:760px;margin:0 auto;padding-left:1.2rem;padding-right:1.2rem;}
.static-hero{padding:2.5rem 0 1.5rem;border-bottom:1px solid var(--border);margin-bottom:2rem;}
.static-eyebrow{font-family:var(--font-mono);font-size:.62rem;letter-spacing:3px;text-transform:uppercase;color:var(--green-bright);margin-bottom:.8rem;display:flex;align-items:center;gap:.5rem;}
.static-eyebrow::before{content:'';width:14px;height:1.5px;background:var(--green-bright);}
.static-title{font-family:var(--font-display);font-size:clamp(2.4rem,6vw,4rem);letter-spacing:2px;line-height:.97;color:var(--ink);}
.static-title .green{color:var(--green-bright);}
.static-sub{font-size:.92rem;color:var(--ink-light);line-height:1.75;margin-top:1rem;max-width:540px;}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin-top:1.5rem;}
.team-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.4rem 1.2rem 1.2rem;text-align:center;transition:border-color .2s;}
.team-card:hover{border-color:var(--green-mid);}
.team-avatar{width:64px;height:64px;border-radius:50%;margin:0 auto .8rem;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700;color:#fff;}
.team-name{font-family:var(--font-display);font-size:1.1rem;letter-spacing:1px;color:var(--ink);}
.team-role{font-family:var(--font-mono);font-size:.62rem;letter-spacing:2px;text-transform:uppercase;color:var(--green-bright);margin-top:.25rem;}
.team-bio{font-size:.78rem;color:var(--ink-light);margin-top:.6rem;line-height:1.6;}
.values-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.5rem;}
.value-card{background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--green);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:1.1rem 1.2rem;}
.value-card strong{display:block;font-size:.9rem;color:var(--ink);margin-bottom:.3rem;}
.value-card span{font-size:.8rem;color:var(--ink-light);line-height:1.6;}
.steps-list{display:flex;flex-direction:column;gap:1.2rem;margin-top:1.5rem;}
.step-row{display:flex;gap:1.2rem;align-items:flex-start;padding:1.4rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);transition:border-color .2s;}
.step-row:hover{border-color:var(--green-mid);}
.step-num-big{font-family:var(--font-display);font-size:2.5rem;letter-spacing:1px;color:var(--green-bright);line-height:1;min-width:44px;}
.step-content h3{font-size:1rem;font-weight:700;color:var(--ink);margin-bottom:.35rem;}
.step-content p{font-size:.83rem;color:var(--ink-light);line-height:1.7;}
.faq-list{margin-top:1.5rem;display:flex;flex-direction:column;gap:.8rem;}
.faq-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;}
.faq-q{padding:1rem 1.2rem;font-size:.9rem;font-weight:600;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.faq-q:hover{color:var(--green-bright);}
.faq-a{padding:0 1.2rem 1rem;font-size:.83rem;color:var(--ink-light);line-height:1.7;}
.historico-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.2rem;margin-top:1.5rem;}
.historico-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .25s;}
.historico-card:hover{border-color:var(--green-mid);box-shadow:0 6px 24px var(--shadow-card);transform:translateY(-2px);}
.historico-img-placeholder{width:100%;height:180px;background:linear-gradient(135deg,var(--surface2),var(--green-pale));display:flex;align-items:center;justify-content:center;font-size:2.5rem;}
.historico-body{padding:1rem 1.2rem 1.1rem;}
.historico-date{font-family:var(--font-mono);font-size:.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--green-bright);margin-bottom:.35rem;}
.historico-title{font-family:var(--font-display);font-size:1.2rem;letter-spacing:1px;color:var(--ink);margin-bottom:.35rem;line-height:1.1;}
.historico-desc{font-size:.78rem;color:var(--ink-light);line-height:1.6;}

/* ══ INFO MODAL (XP system) ══ */
.info-btn{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);color:var(--ink-light);font-size:.78rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0;}
.info-btn:hover{border-color:var(--xp-mid);color:var(--xp);background:var(--xp-pale);}
.xp-info-table{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:.8rem;}
.xp-info-table th{text-align:left;font-family:var(--font-mono);font-size:.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--ink-light);padding:.5rem .6rem;border-bottom:1px solid var(--border);}
.xp-info-table td{padding:.55rem .6rem;border-bottom:1px solid var(--border);color:var(--ink-mid);vertical-align:middle;}
.xp-info-table tr:last-child td{border-bottom:none;}

/* ══ LOADING ══ */
.loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);}
.loading-logo{font-family:var(--font-display);font-size:2.5rem;letter-spacing:4px;color:var(--ink);animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* SKELETON LOADERS */
.skeleton{background:linear-gradient(90deg,var(--surface2) 0%,var(--border) 50%,var(--surface2) 100%);background-size:200% 100%;animation:skeleton-loading 1.5s infinite;border-radius:var(--radius-sm);}
@keyframes skeleton-loading{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.quest-skeleton{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;animation:pulse 1.5s ease-in-out infinite;}
.quest-skeleton-img{width:100%;height:160px;background:var(--surface2);}
.quest-skeleton-header{padding:1rem 1.2rem;display:flex;flex-direction:column;gap:.6rem;}
.quest-skeleton-title{height:20px;background:var(--border-strong);border-radius:var(--radius-sm);width:70%;}
.quest-skeleton-desc{height:12px;background:var(--border);border-radius:var(--radius-sm);width:100%;margin-top:.3rem;}
.quest-skeleton-desc:last-child{width:85%;}

/* ══ MODAL ══ */
.modal-overlay{position:fixed;inset:0;background:var(--modal-overlay);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:1rem;}
.modal-box{background:var(--surface);border:1px solid var(--border-strong);border-radius:20px;padding:1.8rem;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;}
.modal-title{font-family:var(--font-display);font-size:1.6rem;letter-spacing:2px;margin-bottom:1.5rem;}

/* ══ TOAST ══ */
.notif-toast{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%) translateY(-100px);z-index:999;background:var(--surface2);border:1px solid var(--green-mid);border-radius:var(--radius-sm);padding:.75rem 1.5rem;font-size:.82rem;color:var(--green-bright);transition:transform .3s;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.2);}
.notif-toast.show{transform:translateX(-50%) translateY(0);}
@media(max-width:767px){
  .notif-toast{top:auto;bottom:5.5rem;transform:translateX(-50%) translateY(100px);}
  .notif-toast.show{transform:translateX(-50%) translateY(0);}
}

/* ══ EXPLORE ══ */
.explore-page{padding-top:4.5rem;}
.search-bar-wrap{padding:1rem 1.2rem;}
.search-bar{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:.8rem 1rem .8rem 2.8rem;color:var(--ink);font-size:.9rem;outline:none;transition:border-color .2s;}
.search-bar:focus{border-color:var(--green);}
.search-wrap{position:relative;}
.search-icon{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--silver);}

/* ══ PUBLIC PROFILE ══ */
.public-profile-page{padding-top:4.5rem;max-width:600px;margin:0 auto;padding-left:1rem;padding-right:1rem;}

/* ══ RESPONSIVE ══ */
@media(min-width:768px){
  .bottom-nav{display:none;}
  .fab{bottom:1.5rem;}
  .feed-grid{grid-template-columns:repeat(auto-fill,minmax(310px,1fr));}
  .values-grid{grid-template-columns:repeat(3,1fr);}
  .profile-page{padding-top:5rem;}
  .nav-link-galeria-desktop{display:inline-flex;}
  .nav-avatar-desktop{display:flex;}
  #nav-search-desktop{display:flex !important;}
}
@media(max-width:767px){
  .feed-grid{grid-template-columns:1fr;}
  .detail-meta-grid{grid-template-columns:1fr 1fr;}
  .values-grid{grid-template-columns:1fr;}
  .historico-grid{grid-template-columns:1fr;}
  .lore-stats{grid-template-columns:1fr 1fr;}
  .theme-toggle { display:none; }
  .nav-msg-btn { display:none; }
  .nav-link-galeria-desktop { display:none !important; }
  .nav-avatar-desktop { display:none !important; }
}

/* ══ LIGHT MODE READABILITY BOOST ══ */
[data-theme="light"] body { font-weight: 550; }
[data-theme="light"] .quest-desc,
[data-theme="light"] .quest-meta-item,
[data-theme="light"] .spots-label,
[data-theme="light"] .cal-quest-meta,
[data-theme="light"] .msg-thread-preview,
[data-theme="light"] .static-sub,
[data-theme="light"] .team-bio,
[data-theme="light"] .value-card span,
[data-theme="light"] .step-content p,
[data-theme="light"] .faq-a,
[data-theme="light"] .historico-desc,
[data-theme="light"] .profile-bio,
[data-theme="light"] .auth-sub,
[data-theme="light"] .detail-desc { color: #1a2a1a; font-weight: 700; }
[data-theme="light"] .label-field { color: #0a1a0a; font-weight: 800; }
[data-theme="light"] .nav-link { color: #1a3a18; font-weight: 800; }
[data-theme="light"] .section-label { color: #0a4a1a; font-weight: 800; }
[data-theme="light"] .quest-title { color: #0a0a0a; font-weight: 900; }
[data-theme="light"] .feed-hero-title { text-shadow: 0 2px 20px rgba(0,0,0,.6); font-weight: 900; }
[data-theme="light"] .quest-category-label { font-weight: 800; }
[data-theme="light"] .cal-quest-title { color: #0a0a0a; font-weight: 900; }
[data-theme="light"] .msg-thread-title { color: #0a0a0a; font-weight: 900; }
[data-theme="light"] .bnav-item.active { color: #0a4a1a; font-weight: 900; }
[data-theme="light"] .filter-btn.active { color: #0a4a1a; font-weight: 900; }
[data-theme="light"] .tag { color: #0a4a1a; font-weight: 800; }
[data-theme="light"] .input { color: #0a0a0a; font-weight: 600; }
[data-theme="light"] .input::placeholder { color: #5b6855; }
[data-theme="light"] .team-name { font-weight: 900; }
[data-theme="light"] .profile-name { font-weight: 900; }
[data-theme="light"] .feed-section-label { font-weight: 900; color: #0a4a1a; }
[data-theme="light"] .filter-btn { font-weight: 700; }
[data-theme="light"] .filter-btn.active { font-weight: 900; }

/* MOBILE & TABLET FULL RESPONSIVE ══ */
button, .btn, .bnav-item, .nav-link { min-height: 36px; }
@media(max-width:480px) {
  .top-nav { padding: .7rem 1rem; }
  .nav-logo { font-size: 1.15rem; letter-spacing: 2px; }
  .nav-logo-socials { gap: .25rem; }
  .nav-social-btn { font-size: .75rem; width: 20px; height: 20px; }
  .nav-actions { gap: .25rem; }
  .theme-toggle, .nav-msg-btn { width: 30px; height: 30px; font-size: .8rem; display: none; }
  .nav-avatar { width: 30px; height: 30px; font-size: .68rem; }
}
@media(max-width:520px) {
  .hero-collage { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .feed-hero { height: clamp(240px, 70vw, 340px); }
  .feed-hero-title { font-size: clamp(2rem, 9vw, 3rem); }
  .feed-hero-inner { padding: 1.2rem 1rem 1.4rem; }
  .feed-hero-sub { font-size: .8rem; }
  .feed-hero-cta { padding: .6rem 1rem; font-size: .78rem; }
}
@media(min-width:521px) and (max-width:767px) {
  .feed-hero-title { font-size: clamp(2.2rem, 7vw, 3.2rem); }
}
@media(min-width:768px) and (max-width:1024px) {
  .feed-grid { grid-template-columns: repeat(2, 1fr); }
  .profile-page, .create-page, .detail-page, .messages-page, .static-page { padding-left: 1.5rem; padding-right: 1.5rem; }
  .hero-collage { grid-template-columns: 1fr 1fr 1fr 1fr; }
}
@media(max-width:767px) {
  .profile-page, .create-page, .detail-page, .messages-page, .static-page { padding-left: .9rem; padding-right: .9rem; }
  .feed-grid { padding: 0 .75rem 1rem; }
  .feed-filters { padding: .3rem .75rem .8rem; }
  .feed-section-label { padding: 1rem .9rem .4rem; }
  .modal-box { padding: 1.3rem; border-radius: 14px; }
  .card { padding: 1rem 1.1rem; }
  .quest-card-header { padding: .85rem 1rem .65rem; }
  .quest-card-meta { padding: .55rem 1rem; gap: .7rem; }
  .quest-card-footer { padding: .6rem 1rem; }
  .member-item { padding: .55rem .85rem; }
  .chat-box { height: 300px; }
  .profile-banner { height: 120px; border-radius: var(--radius-sm); }
  .profile-avatar-big { width: 60px; height: 60px; }
  .profile-name { font-size: 1.4rem; }
  .profile-xp-card { padding: 1rem 1.1rem; }
  .xp-info-table { font-size: .72rem; }
  .xp-info-table th, .xp-info-table td { padding: .4rem .4rem; }
  .detail-cover { height: 180px; }
  .detail-title { font-size: clamp(1.7rem, 7vw, 2.4rem); }
  .detail-meta-grid { grid-template-columns: 1fr 1fr; gap: .5rem; }
  .step-row { padding: 1rem; gap: .8rem; }
  .step-num-big { font-size: 1.8rem; min-width: 34px; }
  .values-grid { grid-template-columns: 1fr; }
  .team-grid { grid-template-columns: 1fr 1fr; }
  .historico-grid { grid-template-columns: 1fr; }
  .static-hero { padding: 1.5rem 0 1rem; }
  .static-title { font-size: clamp(2rem, 8vw, 3rem); }
  .cal-item { padding: .7rem .85rem; gap: .7rem; }
  .cal-date-box { min-width: 38px; }
  .cal-date-day { font-size: 1.2rem; }
  .notif-toast { font-size: .76rem; padding: .55rem 1rem; max-width: 90vw; white-space: normal; text-align: center; }
  .fab { width: 46px; height: 46px; font-size: 1.4rem; right: .9rem; bottom: 4.8rem; }
  .lore-action-buttons { margin: .8rem 0; }
  .lore-people-container { padding-bottom: 0.3rem; }
}
.page { overflow-x: hidden; }
.feed-filters { -webkit-overflow-scrolling: touch; }

/* ══ RESPONSIVENESS - HAMBURGER MENU ══ */
@media(min-width:768px) {
  .nav-hamburger { display: none !important; }
  .nav-desktop-links { display: flex !important; }
  .menu-sidebar { display: none !important; }
  .menu-overlay { display: none !important; }
}

@media(max-width:767px) {
  .nav-hamburger { display: flex !important; }
  .nav-desktop-links { display: none !important; }
  .top-nav { padding: .7rem .8rem; gap: .3rem; }
  .nav-logo { font-size: 1rem; gap: .3rem; }
  .nav-logo-socials { display: none; }
  .nav-actions { gap: .25rem; }
  .theme-toggle, .nav-msg-btn { width: 34px; height: 34px; font-size: .9rem; }
  .nav-avatar.nav-avatar-desktop { width: 34px; height: 34px; font-size: .65rem; }
  .menu-sidebar { width: 270px; }

}

@media(max-width:480px) {
  .top-nav { padding: .65rem .6rem; gap: .25rem; }
  .nav-logo { font-size: .95rem; gap: .25rem; }
  .nav-actions { gap: .2rem; }
  .nav-hamburger, .theme-toggle, .nav-msg-btn { width: 34px; height: 34px; font-size: .95rem; }
  .nav-avatar.nav-avatar-desktop { width: 34px; height: 34px; }
  .menu-sidebar { width: 260px; }
  .bnav-item { gap: .15rem; padding: .25rem .5rem; font-size: .5rem; }
  .bnav-item svg { width: 18px; height: 18px; }
  .feed-icon { width: 20px; height: 20px; gap: 2px; }
  .feed-icon span { height: 1.5px; }
  .page { padding-top: 3.2rem; padding-bottom: 4.5rem; }
}

/* ══ CALENDÁRIO ══ */

const XP_PER_QUEST = 120;
const XP_CREATE_QUEST = 30;
const LEVELS = [
  {level:1,  title:"Iniciante",      xp:0,     frame:"none",    banner:false, perks:["Acesso ao feed","Criar quests","Chat de grupo"]},
  {level:2,  title:"Explorador",     xp:200,   frame:"none",    banner:false, perks:["Tag personalizada no perfil"]},

  {level:4,  title:"Desbravador",    xp:700,   frame:"bronze",  banner:true,  perks:["Acesso a quests exclusivas (em breve)"]},
  {level:5,  title:"Nómada",         xp:1100,  frame:"silver",  banner:true,  perks:["Moldura Prata no avatar"]},
  {level:8,  title:"Caçador",        xp:2000,  frame:"silver",  banner:true,  perks:["Badge especial no perfil"]},
  {level:10, title:"Veterano",       xp:3000,  frame:"gold",    banner:true,  perks:["Moldura Dourada no avatar","Prioridade em quests lotadas (em breve)"]},
  {level:15, title:"Lenda Urbana",   xp:5000,  frame:"emerald", banner:true,  perks:["Moldura Esmeralda","Acesso beta a novas features"]},
  {level:20, title:"StarChaser",     xp:8000,  frame:"diamond", banner:true,  perks:["Moldura Diamante","Destaque no feed (em breve)"]},
  {level:30, title:"SideQuest OG",   xp:14000, frame:"legend",  banner:true,  perks:["Moldura Lendária animada","Tag OG exclusiva"]},
  {level:50, title:"Imortal",        xp:30000, frame:"legend",  banner:true,  perks:["Estatuto máximo. Tu és a SideQuest."]},
];

const FULL_LEVELS = [];
for(let i=1; i<=50; i++) {
  let checkpoint = LEVELS[0];
  for(const lv of LEVELS) { if(lv.level <= i) checkpoint = lv; else break; }
  let xpForLevel = 0;
  for(let j=0; j<LEVELS.length; j++) {
    if(LEVELS[j].level === i) { xpForLevel = LEVELS[j].xp; break; }
    if(j+1 < LEVELS.length && LEVELS[j].level < i && LEVELS[j+1].level > i) {
      const ratio = (i - LEVELS[j].level) / (LEVELS[j+1].level - LEVELS[j].level);
      xpForLevel = Math.round(LEVELS[j].xp + ratio * (LEVELS[j+1].xp - LEVELS[j].xp));
      break;
    }
    if(j === LEVELS.length-1) xpForLevel = LEVELS[j].xp + (i - LEVELS[j].level) * 800;
  }
  FULL_LEVELS.push({level:i, title:checkpoint.title, xpRequired:xpForLevel, frame:checkpoint.frame, bannerUnlocked:checkpoint.banner, perks:checkpoint.perks});
}

function getLevelData(xp) {
  let current = FULL_LEVELS[0];
  let next = FULL_LEVELS[1];
  for(let i=0; i<FULL_LEVELS.length; i++) {
    if(xp >= FULL_LEVELS[i].xpRequired) {
      current = FULL_LEVELS[i];
      next = FULL_LEVELS[i+1] || null;
    }
  }
  const xpIntoLevel = next ? xp - current.xpRequired : 0;
  const xpNeeded = next ? next.xpRequired - current.xpRequired : 1;
  const pct = next ? Math.min(100, Math.round(xpIntoLevel / xpNeeded * 100)) : 100;
  return { current, next, pct, xpIntoLevel, xpNeeded };
}

function readFileAsDataURL(file) {
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=()=>rej(new Error('fail')); r.readAsDataURL(file); });
}
async function compressImage(file,maxW=900,quality=0.78) {
  const url=await readFileAsDataURL(file);
  return new Promise(res=>{
    const img=new Image(); img.onload=()=>{
      const canvas=document.createElement('canvas'); let w=img.width,h=img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      canvas.width=w;canvas.height=h; canvas.getContext('2d').drawImage(img,0,0,w,h);
      res(canvas.toDataURL('image/jpeg',quality));
    }; img.src=url;
  });
}

// Devolve a chave de data LOCAL (não UTC) no formato AAAA-MM-DD.
// Usar toISOString() aqui introduzia um desfasamento de 1 dia em
// timezones à frente de UTC (ex: Lisboa em horário de verão),
// fazendo com que uma quest do dia 16 aparecesse no dia 17.
function toLocalDateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function getQuestsForDay(date) {
  const dayStr = toLocalDateKey(date);
  return state.quests.filter(q => {
    if(!q.date) return false;
    const qDate = q.date.toDate ? q.date.toDate() : new Date(q.date);
    const qDateStr = toLocalDateKey(qDate);
    return qDateStr === dayStr && (q.members || []).includes(state.user?.uid);
  });
}
 
function renderCalendarSection() {
  const month = state.currentCalendarMonth.getMonth();
  const year = state.currentCalendarMonth.getFullYear();
  const monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const monthYear = `${monthNames[month]} ${year}`;
  
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startDate = new Date(firstDay);
  startDate.setDate(startDate.getDate() - firstDay.getDay());
  
  const days = [];
  const current = new Date(startDate);
  while(current <= lastDay || current.getDay() !== 0) {
    days.push(new Date(current));
    current.setDate(current.getDate() + 1);
  }
  
  const today = new Date();
  today.setHours(0,0,0,0);
  
  let daysHTML = '';
  days.forEach(day => {
    const quests = getQuestsForDay(day);
    const isToday = day.getTime() === today.getTime();
    const isCurrentMonth = day.getMonth() === month;
    const questCount = quests.length;
    
    let className = 'calendar-day-cell';
    if(!isCurrentMonth) className += ' other-month';
    if(isToday) className += ' today';
    if(questCount > 0) className += ' has-quests';
    
    daysHTML += `
      <div class="${className}" ${questCount > 1 ? `data-count="${questCount}"` : ''} onclick="expandCalendarDay(new Date(${day.getFullYear()}, ${day.getMonth()}, ${day.getDate()}))">
        ${day.getDate()}
        ${questCount > 0 ? '<div class="calendar-day-dot"></div>' : ''}
      </div>
    `;
  });
  
  const expandedHTML = state.expandedCalendarDay ? renderExpandedCalendarDay(state.expandedCalendarDay) : '';
  
  return `
    <div class="calendar-section" id="calendar-section-wrap">
      <div class="lore-eyebrow">Calendário de Quests</div>
      <div class="calendar-card">
        <div class="calendar-header">
          <button class="calendar-nav-btn" onclick="previousCalendarMonth()" title="Mês anterior">◀</button>
          <div class="calendar-month-year">${monthYear}</div>
          <button class="calendar-nav-btn" onclick="nextCalendarMonth()" title="Próximo mês">▶</button>
        </div>
        <div class="calendar-weekdays">
          <div class="calendar-weekday">Dom</div>
          <div class="calendar-weekday">Seg</div>
          <div class="calendar-weekday">Ter</div>
          <div class="calendar-weekday">Qua</div>
          <div class="calendar-weekday">Qui</div>
          <div class="calendar-weekday">Sex</div>
          <div class="calendar-weekday">Sab</div>
        </div>
        <div class="calendar-days">
          ${daysHTML}
        </div>
        ${expandedHTML}
      </div>
    </div>
  `;
}
 
function renderExpandedCalendarDay(date) {
  const quests = getQuestsForDay(date);
  const monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const dayStr = `${date.getDate()} ${monthNames[date.getMonth()]} ${date.getFullYear()}`;
  
  if(quests.length === 0) {
    return `<div class="calendar-expanded-day"><div class="calendar-no-quests">Nenhuma quest neste dia</div></div>`;
  }
  
  const questsHTML = quests.map(q => `
    <div class="calendar-quest-item" onclick="navigate('quest', state.quests.find(x=>x.id==='${q.id}'))">
      <div class="calendar-quest-title">${esc(q.title)}</div>
      <div class="calendar-quest-meta">
        ${q.location ? `📍 ${esc(q.location)}` : 'Localização a definir'} · 
        ${formatTime(q.date) || 'Hora a definir'}
      </div>
    </div>
  `).join('');
  
  return `
    <div class="calendar-expanded-day">
      <div class="calendar-expanded-day-title">📅 ${dayStr}</div>
      ${questsHTML}
    </div>
  `;
}

// Substitui apenas o bloco do calendário no DOM, sem re-renderizar
// a página inteira nem fazer scroll para o topo.
function refreshCalendarSection() {
  const container = document.getElementById('calendar-section-wrap');
  if(container) {
    container.outerHTML = renderCalendarSection();
  } else if(state.currentPage === 'profile') {
    navigate('profile');
  }
}
 
function expandCalendarDay(date) {
  if(state.expandedCalendarDay && state.expandedCalendarDay.getTime() === date.getTime()) {
    state.expandedCalendarDay = null;
  } else {
    state.expandedCalendarDay = date;
  }
  refreshCalendarSection();
}
 
function previousCalendarMonth() {
  state.currentCalendarMonth.setMonth(state.currentCalendarMonth.getMonth() - 1);
  refreshCalendarSection();
}
 
function nextCalendarMonth() {
  state.currentCalendarMonth.setMonth(state.currentCalendarMonth.getMonth() + 1);
  refreshCalendarSection();
}

    const app=document.getElementById('app');

function setFilter(tag) { state.filterTag=tag; navigate('feed'); }

function getFilteredQuests() {
  let q=[...state.quests];
  q=q.filter(x=>!x.expired && !x.completed);
  if(state.filterTag!=='all') q=q.filter(x=>(x.tags||[]).includes(state.filterTag));
  if(state.searchQuery) {
    const s=state.searchQuery.toLowerCase();
    q=q.filter(x=>(x.title||'').toLowerCase().includes(s)||(x.description||'').toLowerCase().includes(s)||(x.location||'').toLowerCase().includes(s));
  }
  return q;
}

function renderQuestCard(q) {
  const members=q.members||[]; const max=q.maxPeople||10; 
  const spots = Math.max(0, max - members.length);
  const tags=(q.tags||[]).slice(0,2); const isMember=members.includes(state.user?.uid);
  const imgHtml=q.imageBase64?`<img class="quest-card-img" src="${safeImg(q.imageBase64)}" alt="${esc(q.title)}" loading="lazy">`:`<div class="quest-card-img-placeholder">${TAG_EMOJI[tags[0]]||'⚡'}</div>`;
  return `<div class="quest-card" data-id="${q.id}">
    ${imgHtml}
    <div class="quest-card-header">
      <div class="quest-category-label"><div class="quest-dot"></div>${tags.map(t=>`<span>${esc(t.toUpperCase())}</span>`).join(' · ')}</div>
      <div class="quest-title">${esc(q.title)}</div>
      <div class="quest-desc">${esc(q.description||'')}</div>
    </div>
    <div class="quest-card-meta">
      ${q.date?`<div class="quest-meta-item">📅 ${formatDate(q.date)}</div>`:''}
      ${q.location?`<div class="quest-meta-item">📍 ${esc(q.location)}</div>`:''}
      <div class="quest-meta-item">👥 ${members.length}/${max}</div>
      ${spots<=2&&spots>0?`<div class="quest-meta-item" style="color:var(--green-bright)">⚡ ${spots} vaga${spots>1?'s':''}</div>`:''}
      ${spots===0?`<div class="quest-meta-item" style="color:var(--red)">🔴 Lotado</div>`:''}
    </div>
    <div class="quest-card-footer">
      <div style="display:flex;align-items:center">
        <div class="avatar-stack">${renderAvatarStack(members.slice(0,3))}</div>
        <span class="spots-label">${spots>0?spots+' vagas':'lotado'}</span>
      </div>
      ${isMember?`<span style="font-family:var(--font-mono);font-size:.6rem;color:var(--green-bright)">✓ MEMBRO</span>`:''}
    </div>
  </div>`;
}

let userCache = {};

async function getUserData(uid) {
  if (userCache[uid]) return userCache[uid];
  try {
    const doc = await db.collection('users').doc(uid).get();
    const data = doc.exists ? doc.data() : {name: 'Utilizador', photoURL: null};
    userCache[uid] = data;
    return data;
  } catch(e) {
    return {name: 'Utilizador', photoURL: null};
  }
}

function renderAvatarStack(uids) {
  return uids.map(uid=>{
    const col=getAvatarColor(uid); const init=getInitials(uid.slice(0,4));
    const userData = userCache[uid];
    const content = userData?.photoURL 
      ? `<img src="${safeImg(userData.photoURL)}" alt="avatar" style="width:100%;height:100%;object-fit:cover">`
      : init;
    return `<div class="avatar-sm" style="background:${!userData?.photoURL ? col : 'transparent'}" title="${userData?.name || 'Participante'}">${content}</div>`;
  }).join('');
}

function bindCreate() {
  selectedTags=[]; createImageB64=null;
  document.querySelectorAll('.tag-select-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const t=btn.dataset.tag;
      if(selectedTags.includes(t)){selectedTags=selectedTags.filter(x=>x!==t);btn.classList.remove('selected');}
      else if(selectedTags.length<3){selectedTags.push(t);btn.classList.add('selected');}
    });
  });
  document.getElementById('quest-img-input')?.addEventListener('change',async e=>{
    const file=e.target.files[0]; if(!file) return;
    if(!isImageFile(file)){showToast('Apenas imagens (JPG, PNG, GIF, WebP).');return;}
    if(file.size>5*1024*1024){showToast('Foto demasiado grande');return;}
    const btn=document.getElementById('create-btn'); btn.disabled=true; btn.textContent='A processar...';
    createImageB64=await compressImage(file);
    const wrap=document.getElementById('img-preview-wrap');
    wrap.innerHTML=`<img src="${createImageB64}" style="width:100%;height:200px;object-fit:cover;border-radius:calc(var(--radius)-2px)">`;
    document.getElementById('img-upload-area').classList.add('has-img');
    document.getElementById('img-overlay').style.display='flex';
    btn.disabled=false; btn.textContent='Publicar Quest';
  });
  document.getElementById('create-btn')?.addEventListener('click',submitCreateQuest);
}
async function submitCreateQuest() {
  const btn=document.getElementById('create-btn'); const errEl=document.getElementById('create-error');
  const title=document.getElementById('q-title')?.value.trim();
  const desc=document.getElementById('q-desc')?.value.trim();
  const loc=document.getElementById('q-location')?.value.trim();
  const dateVal=document.getElementById('q-date')?.value;
  const maxP=parseInt(document.getElementById('q-max')?.value)||8;
  if(!title||!desc){errEl.textContent='Título e descrição são obrigatórios.';errEl.classList.remove('hidden');return;}
  if(title.length>80){errEl.textContent='Título demasiado longo (máx. 80).';errEl.classList.remove('hidden');return;}
  if(desc.length>1000){errEl.textContent='Descrição demasiado longa (máx. 1000).';errEl.classList.remove('hidden');return;}
  if(loc&&loc.length>100){errEl.textContent='Localização demasiado longa (máx. 100).';errEl.classList.remove('hidden');return;}
  if(selectedTags.length===0){errEl.textContent='Seleciona pelo menos uma tag.';errEl.classList.remove('hidden');return;}
  if(!dateVal){errEl.textContent='Data e hora são obrigatórias.';errEl.classList.remove('hidden');return;}
  if(new Date(dateVal).getTime()<Date.now()-60000){errEl.textContent='A data tem de ser no futuro.';errEl.classList.remove('hidden');return;}
  if(maxP<2||maxP>50){errEl.textContent='Participantes: entre 2 e 50.';errEl.classList.remove('hidden');return;}
  if(!rateLimit('createQuest',30000)){errEl.textContent='Calma! Espera 30s entre quests.';errEl.classList.remove('hidden');return;}
  btn.disabled=true; btn.textContent='A publicar...';
  try {
    const currentXp = state.profile?.xp || 0;
    const newXp = currentXp + XP_CREATE_QUEST;
    await db.collection('quests').add({
      title,description:desc,tags:selectedTags,location:loc||null,
      date:dateVal?firebase.firestore.Timestamp.fromDate(new Date(dateVal)):null,
      maxPeople:maxP,members:[state.user.uid],
      createdBy:state.user.uid,createdByName:state.profile?.name||state.user.email,
      imageBase64:createImageB64||null,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('users').doc(state.user.uid).set({xp:newXp},{merge:true});
    state.profile={...state.profile,xp:newXp};
    showToast('⚡ Quest publicada! +'+XP_CREATE_QUEST+' XP');
    navigate('feed');
  } catch(e) { errEl.textContent=friendlyError(e); errEl.classList.remove('hidden'); btn.disabled=false; btn.textContent='Publicar Quest'; }
}

let userNamesCache = {};
async function getUserName(uid) {
  if(userNamesCache[uid]) return userNamesCache[uid];
  try {
    const doc = await db.collection('users').doc(uid).get();
    const name = doc.exists ? doc.data().name : 'Anónimo';
    userNamesCache[uid] = name;
    return name;
  } catch(e) { return 'Anónimo'; }
}

function renderMemberItem(uid,creatorUid) {
  const col=getAvatarColor(uid); 
  const init=getInitials(uid.slice(0,4));
  const isCurrentUser = uid===state.user?.uid;
  
  const userData = userCache[uid];
  const name = isCurrentUser ? 'Tu' : (userData?.name || 'A carregar...');
  const photoURL = userData?.photoURL;
  
  const photoHtml = photoURL 
    ? `<img src="${safeImg(photoURL)}" alt="avatar" style="width:36px;height:36px;border-radius:50%;object-fit:cover">`
    : `<div class="member-avatar" style="background:${col}">${init}</div>`;
  
  return `<div class="member-item" onclick="viewUserProfile('${uid}')">
    ${photoHtml}
    <div><div class="member-name" id="member-name-${uid}">${name}</div><div style="font-size:.7rem;color:var(--ink-light);font-family:var(--font-mono)">${userData?.email || uid.slice(0,8)}</div></div>
    ${uid===creatorUid?'<span class="creator-badge">CRIADOR</span>':''}
  </div>`;
}

async function loadMemberNames(memberIds) {
  for(const uid of memberIds) {
    if(uid !== state.user?.uid) {
      const name = await getUserName(uid);
      const el = document.getElementById(`member-name-${uid}`);
      if(el) el.textContent = name;
    }
  }
}
function bindQuestDetail() {
  const q=state.activeQuest; if(!q) return;
  joinBtnDisabled=false;
  document.getElementById('join-btn')?.addEventListener('click',()=>joinQuest(q.id));
  document.getElementById('leave-btn')?.addEventListener('click',()=>leaveQuest(q.id));
  document.getElementById('delete-btn')?.addEventListener('click',()=>deleteQuest(q.id));
  if((q.members||[]).includes(state.user?.uid)) initChat(q.id);
  loadMemberNames(q.members||[]);
}
async function joinQuest(questId) {
  if(joinBtnDisabled) return;
  joinBtnDisabled=true;
  try {
    await db.collection('quests').doc(questId).update({members:firebase.firestore.FieldValue.arrayUnion(state.user.uid)});
    const u=state.quests.find(q=>q.id===questId);
    if(u){u.members=[...(u.members||[]),state.user.uid];state.activeQuest=u;}
    const pc=document.getElementById('page-container');
    if(pc) { pc.innerHTML=renderQuestDetail(); bindQuestDetail(); }
    showToast('⚡ Entraste na quest!');
    joinBtnDisabled=false;
  } catch(e){showToast(friendlyError(e));joinBtnDisabled=false;}
}
async function leaveQuest(questId) {
  if(!confirm('Sair desta quest?')) return;
  try {
    await db.collection('quests').doc(questId).update({members:firebase.firestore.FieldValue.arrayRemove(state.user.uid)});
    state.activeQuest=null;
    navigate('feed');
    showToast('Saíste da quest.');
  } catch(e){showToast(friendlyError(e));}
}
async function deleteQuest(questId) {
  if(!confirm('Eliminar esta quest?')) return;
  try {
    await db.collection('quests').doc(questId).delete();
    await rtdb.ref(`chats/${questId}`).remove();
    showToast('Quest eliminada.'); navigate('feed');
  } catch(e){showToast(friendlyError(e));}
}
