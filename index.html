function bindCreate() {
  selectedTags=[]; createImageB64=null;
  document.querySelectorAll('.tag-select-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const t=btn.dataset.tag;
      if(selectedTags.includes(t)){selectedTags=selectedTags.filter(x=>x!==t);btn.classList.remove('selected');}
      else if(selectedTags.length<3){selectedTags.push(t);btn.classList.add('selected');}
    });
  });
  document.getElementById('quest-img-input')?.addEventListener('change',async e=>{
    const file=e.target.files[0]; if(!file) return;
    if(!isImageFile(file)){showToast(_t('Only images (JPG, PNG, GIF, WebP).'));return;}
    if(file.size>5*1024*1024){showToast(_t('Photo too large'));return;}
    const btn=document.getElementById('create-btn'); btn.disabled=true; btn.textContent=_t('Processing...');
    createImageB64=await compressImage(file);
    const wrap=document.getElementById('img-preview-wrap');
    wrap.innerHTML=`<img src="${createImageB64}" style="width:100%;height:200px;object-fit:cover;border-radius:calc(var(--radius)-2px)">`;
    document.getElementById('img-upload-area').classList.add('has-img');
    document.getElementById('img-overlay').style.display='flex';
    btn.disabled=false; btn.textContent=_t('Publish Quest');
  });
  document.getElementById('create-btn')?.addEventListener('click',submitCreateQuest);
}
async function submitCreateQuest() {
  const btn=document.getElementById('create-btn'); const errEl=document.getElementById('create-error');
  const title=document.getElementById('q-title')?.value.trim();
  const desc=document.getElementById('q-desc')?.value.trim();
  const loc=document.getElementById('q-location')?.value.trim();
  const dateVal=document.getElementById('q-date')?.value;
  const maxP=parseInt(document.getElementById('q-max')?.value)||8;
  const fail=(k)=>{errEl.textContent=_t(k);errEl.classList.remove('hidden');};
  if(!title||!desc){fail('Title and description are required.');return;}
  if(title.length>80){fail('Title too long (max. 80).');return;}
  if(desc.length>1000){fail('Description too long (max. 1000).');return;}
  if(loc&&loc.length>100){fail('Location too long (max. 100).');return;}
  if(selectedTags.length===0){fail('Select at least one tag.');return;}
  if(!dateVal){fail('Date and time are required.');return;}
  if(new Date(dateVal).getTime()<Date.now()-60000){fail('The date must be in the future.');return;}
  if(maxP<2||maxP>50){fail('Participants: between 2 and 50.');return;}
  if(!rateLimit('createQuest',30000)){fail('Easy! Wait 30s between quests.');return;}
  btn.disabled=true; btn.textContent=_t('Publishing...');
  try {
    const currentXp = state.profile?.xp || 0;
    const newXp = currentXp + XP_CREATE_QUEST;
    await db.collection('quests').add({
      title,description:desc,tags:selectedTags,location:loc||null,
      date:dateVal?firebase.firestore.Timestamp.fromDate(new Date(dateVal)):null,
      maxPeople:maxP,members:[state.user.uid],
      createdBy:state.user.uid,createdByName:state.profile?.name||state.user.email,
      imageBase64:createImageB64||null,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('users').doc(state.user.uid).set({xp:newXp},{merge:true});
    state.profile={...state.profile,xp:newXp};
    showToast(_t('⚡ Quest published! +{n} XP',{n:XP_CREATE_QUEST}));
    navigate('feed');
  } catch(e) { errEl.textContent=friendlyError(e); errEl.classList.remove('hidden'); btn.disabled=false; btn.textContent=_t('Publish Quest'); }
}

function renderMemberItem(uid,creatorUid) {
  const col=getAvatarColor(uid); 
  const init=getInitials(uid.slice(0,4));
  const isCurrentUser = uid===state.user?.uid;
  
  const userData = userCache[uid];
  const name = isCurrentUser ? _t('You') : (userData?.name || _t('Loading...'));
  const photoURL = userData?.photoURL;
  
  const photoHtml = photoURL 
    ? `<img src="${safeImg(photoURL)}" alt="avatar" style="width:36px;height:36px;border-radius:50%;object-fit:cover">`
    : `<div class="member-avatar" style="background:${col}">${init}</div>`;
  
  // O criador da quest pode expulsar qualquer membro (exceto ele próprio)
  const iAmCreator = state.activeQuest?.createdBy === state.user?.uid;
  const kickBtn = (iAmCreator && uid !== creatorUid)
    ? `<button class="member-kick-btn" title="${_t('Remove from quest')}" onclick="event.stopPropagation();expelMember('${state.activeQuest?.id}','${uid}')">✕</button>`
    : '';

async function expelMember(questId, uid) {
  const q = state.quests.find(x => x.id === questId);
  if(!q || q.createdBy !== state.user?.uid) return; // só o criador
  if(uid === q.createdBy) return; // nunca o próprio criador
  const name = userCache[uid]?.name || _t('this member');
  if(!confirm(_t('Remove {name} from the quest?',{name}))) return;
  try {
    await db.collection('quests').doc(questId).update({
      members: firebase.firestore.FieldValue.arrayRemove(uid)

    q.members = (q.members || []).filter(m => m !== uid);
    if(state.activeQuest?.id === questId) state.activeQuest = q;

    if(state.currentPage === 'quest') navigate('quest', q);

function initChat(questId) {
  console.log('🔧 initChat chamado com questId:', questId);

  if (!questId) {
    console.error('❌ ERRO: questId é undefined!');
    return;
  }

  currentChatQuestId = questId;

  if (chatListener) {
    console.log('🧹 Removendo listener anterior');
    chatListener();
    chatListener = null;
  }

  const chatPath = `chats/${questId}/messages`;
  console.log('📍 Path Firebase:', chatPath);

  const chatRef = rtdb.ref(chatPath);
  const query = chatRef.limitToLast(60);

  const callback = (snap) => {
    console.log('✅ Dados recebidos do Firebase!');
    console.log('📦 Snapshot:', snap.val());

    const msgs = [];

    snap.forEach((child) => {
      msgs.push({
        id: child.key,
        ...child.val()
      });
    });

    console.log('📨 Mensagens parseadas:', msgs);
    renderChatMessages(msgs);
  };

  const errorCallback = (error) => {
    console.error('❌ Erro ao ler Firebase:', error.code, error.message);
  };

  query.on('value', callback, errorCallback);

  chatListener = () => {
    console.log('❌ A desligar chat listener');
    query.off('value', callback);
  };

  bindChatEvents();
}

function bindChatEvents() {
  const sendBtn = document.getElementById('chat-send');
  const input = document.getElementById('chat-input');

  console.log('🔗 Send button encontrado?', !!sendBtn);
  console.log('🔗 Input encontrado?', !!input);

  if (sendBtn) {
    sendBtn.onclick = () => {
      console.log('🖱️ Botão clicado!');
      sendChatMsg();
    };
  }

  if (input) {
    input.onkeydown = (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        console.log('⌨️ Enter pressionado!');
        sendChatMsg();
      }
    };
  }
}

async function sendChatMsg() {
  const input = document.getElementById('chat-input');

  if (!input || !input.value.trim()) {
    console.warn('⚠️ Sem input ou mensagem vazia');
    return;
  }

  if (!state.user) {
    console.error('❌ User não autenticado');
    showToast(_t('Sign in to send messages'));
    return;
  }

  const questId = currentChatQuestId || state.activeQuest?.id;

  if (!questId) {
    console.error('❌ Sem quest ID');
    showToast(_t('Error: quest not loaded'));
    return;
  }

  const text = input.value.trim();
  if(!text) return;
  if(text.length>500){ showToast(_t('Message too long (max. 500).')); return; }
  if(!rateLimit('chatMsg',1200)){ showToast(_t("Easy! You're sending too fast.")); return; }
  input.value = '';

  const data = {
    uid: state.user.uid,
    name: state.profile?.name || state.user.email?.split('@')[0] || _t('Anonymous'),
    text: text,
    ts: firebase.database.ServerValue.TIMESTAMP
  };

  const path = `chats/${questId}/messages`;
  const ref = rtdb.ref(path).push();

  try {
    await Promise.race([
      ref.set(data),
      new Promise((_, reject) =>
        setTimeout(() => reject(new Error('Firebase write timeout after 8s')), 8000)
      )
    ]);

    showToast(_t('✓ Sent'));

  } catch (error) {
    showToast(friendlyError(error));

    input.value = text;
  }
}

// ── Tradução de mensagens do chat ──
// Guarda, por mensagem, a tradução já pedida (para sobreviver aos re-renders do chat).
let chatTrans = {};      // msgId -> {lang, text, shown, loading, same}
let lastChatMsgs = [];

// Usa o endpoint público do Google Translate (sem chave) e, se falhar, o MyMemory.
// NOTA: o texto da mensagem é enviado a esses serviços quando o utilizador carrega em "Traduzir".
async function translateText(text, target) {
  const tl = ({en:'en',pt:'pt',fr:'fr',de:'de',it:'it'})[target] || 'en';
  try {
    const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' + tl + '&dt=t&q=' + encodeURIComponent(text));
    if(!r.ok) throw new Error('http');
    const d = await r.json();
    const out = (d[0] || []).map(x => x[0]).join('');
    if(!out) throw new Error('empty');
    return { text: out, src: String(d[2] || '') };
  } catch(e1) {
    const r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text.slice(0, 450)) + '&langpair=Autodetect|' + tl);
    if(!r.ok) throw new Error('http2');
    const d = await r.json();
    const out = d && d.responseData && d.responseData.translatedText;
    if(!out) throw new Error('empty2');
    return { text: out, src: String((d.responseData && d.responseData.detectedLanguage) || '') };
  }
}

async function toggleChatTranslation(id, text) {
  const cur = chatTrans[id];
  if(cur && cur.loading) return;
  if(cur && cur.lang === currentLang) {
    if(cur.same) { showToast(_t('This message is already in your language')); return; }
    cur.shown = !cur.shown;
    renderChatMessages(lastChatMsgs);
    return;
  }
  chatTrans[id] = { lang: currentLang, loading: true, shown: false };
  renderChatMessages(lastChatMsgs);
  try {
    const r = await translateText(text, currentLang);
    const same = r.src && r.src.toLowerCase().split('-')[0] === currentLang;
    chatTrans[id] = same
      ? { lang: currentLang, same: true, shown: false }
      : { lang: currentLang, text: r.text, shown: true };
    if(same) showToast(_t('This message is already in your language'));
  } catch(e) {
    delete chatTrans[id];
    showToast(_t('Translation unavailable. Try again.'));
  }
  renderChatMessages(lastChatMsgs);
}

function renderChatMessages(msgs) {
  const box = document.getElementById('chat-messages');

  if (!box) {
    console.error('❌ Elemento #chat-messages não encontrado');
    return;
  }

  lastChatMsgs = msgs;
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 90;
  box.innerHTML = '';

  if (!msgs.length) {
    const empty = document.createElement('div');
    empty.className = 'chat-empty';
    empty.textContent = _t('No messages yet.');
    box.appendChild(empty);
    return;
  }

  msgs.forEach((msg) => {
    const own = msg.uid === state.user?.uid;
    const row = document.createElement('div');
    row.className = 'chat-msg' + (own ? ' own' : '');

    const av = document.createElement('div');
    av.className = 'chat-avatar';
    av.style.background = getAvatarColor(msg.uid || msg.name || '');
    av.textContent = getInitials(msg.name || '');

    const col = document.createElement('div');
    col.className = 'chat-col';

    if (!own) {
      const name = document.createElement('div');
      name.className = 'chat-name';
      name.textContent = msg.name || _t('Anonymous');
      col.appendChild(name);
    }

    const bubble = document.createElement('div');
    bubble.className = 'chat-bubble';
    const text = document.createElement('span');
    text.textContent = msg.text || '';
    bubble.appendChild(text);

    const tr = chatTrans[msg.id];
    const active = tr && tr.lang === currentLang;
    if (active && tr.shown && tr.text) {
      const tBox = document.createElement('div');
      tBox.className = 'chat-translation';
      const lbl = document.createElement('span');
      lbl.className = 'chat-translation-label';
      lbl.textContent = '🌐 ' + _t('Translation');
      const tTxt = document.createElement('span');
      tTxt.textContent = tr.text;
      tBox.appendChild(lbl);
      tBox.appendChild(tTxt);
      bubble.appendChild(tBox);
    }
    col.appendChild(bubble);

    if (!own && msg.text) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chat-translate-btn';
      if (active && tr.loading) { btn.textContent = _t('Translating…'); btn.disabled = true; }
      else if (active && tr.shown) btn.textContent = _t('Hide translation');
      else btn.textContent = '🌐 ' + _t('Translate');
      btn.onclick = () => toggleChatTranslation(msg.id, msg.text);
      col.appendChild(btn);
    }

    row.appendChild(av);
    row.appendChild(col);
    box.appendChild(row);
  });

  if (nearBottom || !box.dataset.init) { box.scrollTop = box.scrollHeight; box.dataset.init = '1'; }
}

// Itens por defeito (traduzidos no momento de mostrar). i18n:true → mostra _t(texto)
const LORE_DEFAULT_BUCKET = [
  'Sleep on the beach'
];

function loreTs(q){ const v=q.completedAt||q.date; if(!v) return 0; const d=v.toDate?v.toDate():new Date(v); return d.getTime()||0; }
function loreStrip(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function computeLore(uid){
  uid = uid || state.user?.uid;
  const all=state.quests||[];
  const mine=all.filter(q=>(q.members||[]).includes(uid));
  const lived=mine.filter(q=>q.completed).sort((a,b)=>loreTs(a)-loreTs(b));
  const peopleSet=new Set();
  const peopleCount={};
  mine.forEach(q=>(q.members||[]).forEach(m=>{ if(m&&m!==uid){ peopleSet.add(m); peopleCount[m]=(peopleCount[m]||0)+1; } }));
  const people=Object.entries(peopleCount).map(([id,n])=>({id,n})).sort((a,b)=>b.n-a.n);
  const locSet=new Set(lived.map(q=>(q.location||'').trim()).filter(Boolean));
  const firsts={};
  lived.forEach(q=>(q.tags||[]).forEach(t=>{ if(!firsts[t]) firsts[t]={ts:loreTs(q),title:q.title}; }));
  return { mine, lived, peopleCount:peopleSet.size, people, locations:[...locSet], firsts };
}

// ── Bucket list (localStorage por utilizador) ──
function loreBucketKey(){ return 'sq-bucket-'+(state.user?.uid||''); }
function loreGetBucket(){
  try{ const raw=localStorage.getItem(loreBucketKey()); if(raw) return JSON.parse(raw); }catch(e){}
  return LORE_DEFAULT_BUCKET.map(t=>({text:t,i18n:true,done:false,touched:false}));
}
function loreSaveBucket(list){ try{ localStorage.setItem(loreBucketKey(),JSON.stringify(list)); }catch(e){} }
function loreAutoUnlock(list,lored){
  const hay=lored.map(q=>loreStrip((q.title||'')+' '+(q.tags||[]).join(' ')+' '+(q.location||'')));
  let changed=false;
  list.forEach(it=>{
    if(it.touched||it.done) return;
    // para itens por defeito, também procura pelas palavras em português (os dados das quests estão em PT)
    const base = it.text + (it.i18n && TR[it.text] ? ' ' + TR[it.text][0] : '');
    const words=loreStrip(base).split(/\s+/).filter(w=>w.length>3);
    if(words.some(w=>hay.some(h=>h.includes(w)))){ it.done=true; it.auto=true; changed=true; }
  });
  if(changed) loreSaveBucket(list);
  return list;
}
function loreToggleBucket(i){
  const list=loreGetBucket();
  if(!list[i]) return;
  list[i].done=!list[i].done; list[i].touched=true; list[i].auto=false;
  loreSaveBucket(list);
  navigate('profile');
}
function loreAddBucket(){
  const inp=document.getElementById('lore-bucket-input');
  const v=(inp?.value||'').trim();
  if(!v) return;
  const list=loreGetBucket();
  list.unshift({text:v,done:false,touched:true});
  loreSaveBucket(list);
  navigate('profile');
}
function loreBucketKeydown(e){ if(e.key==='Enter') loreAddBucket(); }
function loreDelBucket(i,e){
  e.stopPropagation();
  const list=loreGetBucket();
  list.splice(i,1);
  loreSaveBucket(list);
  navigate('profile');
}

// ── Partilhar LORE: gera imagem estilo Wrapped (canvas, sem libs) ──
async function shareLore(){
  const p=state.profile||{};
  const lore=computeLore();
  const lv=getLevelData(p.xp||0).current;
  showToast(_t('Creating your LORE…'));
  try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch(e){}

  const W=1080,H=1920,cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  const x=cv.getContext('2d');
  // fundo
  x.fillStyle='#0a0c08'; x.fillRect(0,0,W,H);
  const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'rgba(34,197,94,.10)'); g.addColorStop(.4,'rgba(0,0,0,0)'); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle='#22c55e'; x.fillRect(110,150,70,6);
  // header
  x.fillStyle='#9aa896'; x.font="600 30px 'DM Mono',monospace"; x.textAlign='left';
  x.fillText(_t('Your LORE').toUpperCase(),110,225);
  // nome
  x.fillStyle='#e8ede4'; x.font="120px 'Bebas Neue',sans-serif";
  x.fillText((p.name||_t('Explorer')).toUpperCase().slice(0,16),108,360);
  x.fillStyle='#9aa896'; x.font="500 34px 'DM Mono',monospace";
  x.fillText(_t('Chapter').toUpperCase()+' '+lv.level+' \u00b7 '+levelTitle(lv).toUpperCase(),110,420);

  // stats grandes
  const stats=[
    [lore.lived.length, _t('adventures lived')],
    [lore.peopleCount, _t('people in the story')],
    [lore.locations.length, _t('places explored')],
    [Object.keys(lore.firsts).length, _t('firsts')]
  ];
  let yy=620;
  stats.forEach(s=>{
    x.fillStyle='#22c55e'; x.font="150px 'Bebas Neue',sans-serif"; x.textAlign='left';
    x.fillText(String(s[0]),110,yy);
    const nw=x.measureText(String(s[0])).width;
    x.fillStyle='#cfd8c8'; x.font="500 44px 'Outfit',sans-serif";
    x.fillText(s[1],110+nw+34,yy-22);
    yy+=190;
  });

  // memórias
  const mem=Object.keys(lore.firsts).slice(0,3).map(t=>LORE_BADGES[t]?LORE_BADGES[t].name:t);
  if(mem.length){
    x.fillStyle='#9aa896'; x.font="600 30px 'DM Mono',monospace";
    x.fillText(_t('Memories').toUpperCase(),110,yy+10);
    x.fillStyle='#e8ede4'; x.font="500 46px 'Outfit',sans-serif";
    mem.forEach((m,i)=>{ x.fillText('\u2726  '+m,110,yy+75+i*68); });
  }

  // rodapé
  x.textAlign='center';
  x.fillStyle='#e8ede4'; x.font="90px 'Bebas Neue',sans-serif";
  x.fillText('SIDEQUEST',W/2,H-180);
  x.fillStyle='#22c55e'; x.font="500 40px 'Outfit',sans-serif";
  x.fillText(_t('Collect stories.'),W/2,H-110);

  cv.toBlob(async (blob)=>{
    if(!blob){ showToast(_t('Error generating image')); return; }
    const url=URL.createObjectURL(blob);
    const file=new File([blob],'sidequest-lore.png',{type:'image/png'});
    const overlay=document.createElement('div');
    overlay.className='lore-share-modal';
    overlay.innerHTML=`
      <img src="${url}" alt="${_t('My LORE')}">
      <div class="lore-share-actions">
        <button class="btn btn-primary btn-sm" id="lore-dl">${_t('Save image')}</button>
        ${navigator.canShare&&navigator.canShare({files:[file]})?`<button class="btn btn-secondary btn-sm" id="lore-sh">${_t('Share')}</button>`:''}
        <button class="btn btn-ghost btn-sm" id="lore-cl">${_t('Close')}</button>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',e=>{ if(e.target===overlay){ overlay.remove(); URL.revokeObjectURL(url); }});
    document.getElementById('lore-dl').onclick=()=>{ const a=document.createElement('a'); a.href=url; a.download='sidequest-lore.png'; a.click(); };
    const sh=document.getElementById('lore-sh'); if(sh) sh.onclick=async()=>{ try{ await navigator.share({files:[file],title:_t('My LORE'),text:_t('My story on SideQuest 🌌')}); }catch(e){} };
    document.getElementById('lore-cl').onclick=()=>{ overlay.remove(); URL.revokeObjectURL(url); };
  },'image/png');
}

// PROMO CODES
// ════════════════════════════════════════════
const PROMO_CODES = {
  'OP2026': { xpBonus: 1200, description: '+10 instant levels (admin code)', oneTimePerUser: true },
  'BETA2026': { betaTester: true, description: 'Beta access - First Explorer badge', oneTimePerUser: true },
};
function getUsedCodes() {
  try { return JSON.parse(localStorage.getItem('sq-used-codes-' + (state.user?.uid||'')) || '[]'); }
  catch(e) { return []; }
}
function markCodeUsed(code) {
  const used = getUsedCodes();
  used.push(code.toUpperCase());
  localStorage.setItem('sq-used-codes-' + (state.user?.uid||''), JSON.stringify(used));
}

function renderPromoCodeSection() {
  return `<div style="margin:1.5rem 0">
    <div class="section-label">${_t('Exclusive Code')}</div>
    <div style="display:flex;gap:.6rem;align-items:center">
      <input class="input" id="promo-input" placeholder="${_t('Enter your code...')}" style="text-transform:uppercase;letter-spacing:2px;font-family:var(--font-mono);font-size:.82rem" maxlength="20">
      <button class="btn btn-primary btn-sm" onclick="applyPromoCode()" style="white-space:nowrap;flex-shrink:0">${_t('Apply')}</button>
    </div>
    <div id="promo-msg" style="font-size:.78rem;margin-top:.5rem;font-family:var(--font-mono)"></div>
  </div>`;
}

async function applyPromoCode() {
  const input = document.getElementById('promo-input');
  const msgEl = document.getElementById('promo-msg');
  if(!input||!msgEl) return;
  const code = input.value.trim().toUpperCase();
  if(!code) { msgEl.style.color='var(--red)'; msgEl.textContent=_t('Enter a code.'); return; }
  const promo = PROMO_CODES[code];
  if(!promo) { msgEl.style.color='var(--red)'; msgEl.textContent=_t('Invalid code.'); return; }
  const used = getUsedCodes();
  if(promo.oneTimePerUser && used.includes(code)) {
    msgEl.style.color='var(--red)'; msgEl.textContent=_t('This code has already been used.'); return;
  }
  
  try {
    let updateData = {};
    if(promo.xpBonus) {
      const currentXp = state.profile?.xp || 0;
      const newXp = currentXp + promo.xpBonus;
      updateData.xp = newXp;
      state.profile = { ...state.profile, xp: newXp };
    }
    if(promo.betaTester) {
      updateData.isBetaTester = true;
      state.profile = { ...state.profile, isBetaTester: true };
    }
    
    await db.collection('users').doc(state.user.uid).set(updateData, { merge: true });
    if(promo.oneTimePerUser) markCodeUsed(code);
    input.value = '';
    
    showToast(_t('🎉 Code applied! {desc}',{desc:_t(promo.description)}));
    msgEl.style.color='var(--green-bright)';
    msgEl.textContent = `✓ ${_t(promo.description)}`;
    setTimeout(()=>navigate('profile'), 1200);
  } catch(e) { msgEl.style.color='var(--red)'; msgEl.textContent=friendlyError(e); }
}

function bindProfile() {
  document.getElementById('edit-profile-btn')?.addEventListener('click',openEditModal);

  // Resolver nomes/fotos das "Pessoas da tua história"
  document.querySelectorAll('.lore-person[data-uid]').forEach(async el=>{
    const uid=el.dataset.uid;
    try{
      const d=await getUserData(uid);
      const nameEl=el.querySelector('.lore-person-name');
      if(nameEl) nameEl.textContent=d?.name||_t('Adventurer');
      if(d?.photoURL){
        const av=el.querySelector('.lore-person-av');
        if(av) av.innerHTML=`<img src="${safeImg(d.photoURL)}" alt="av">`;
      }
    }catch(e){}
  });

  // Foto de perfil
  document.getElementById('profile-photo-input')?.addEventListener('change',async e=>{
    const file=e.target.files[0]; if(!file) return;
    if(!isImageFile(file)){showToast(_t('Only images (JPG, PNG, GIF, WebP).'));return;}
    if(file.size>5*1024*1024){showToast(_t('Photo too large'));return;}
    showToast(_t('Processing…'));
    const b64=await compressImage(file,400,0.85);
    await db.collection('users').doc(state.user.uid).set({photoURL:b64},{merge:true});
    state.profile={...state.profile,photoURL:b64};
    const d=document.getElementById('profile-avatar-display');
    if(d) d.innerHTML=`<img src="${b64}" alt="av">`;
    const na=document.querySelector('.nav-avatar'); if(na) na.innerHTML=`<img src="${b64}" alt="av">`;
    showToast(_t('Photo updated ✓'));
  });

  // Banner
  const bannerEl=document.getElementById('profile-banner');
  const bannerInput=document.getElementById('banner-img-input');
  if(bannerEl&&bannerInput) {
    bannerEl.addEventListener('click',()=>bannerInput.click());
    bannerInput.addEventListener('change',async e=>{
      const file=e.target.files[0]; if(!file) return;
      if(!isImageFile(file)){showToast(_t('Only images (JPG, PNG, GIF, WebP).'));return;}
      if(file.size>5*1024*1024){showToast(_t('Photo too large'));return;}
      showToast(_t('Processing banner…'));
      const b64=await compressImage(file,1200,0.8);
      await db.collection('users').doc(state.user.uid).set({bannerURL:b64},{merge:true});
      state.profile={...state.profile,bannerURL:b64};
      navigate('profile');
      showToast(_t('Banner updated ✓'));
    });
  }
}

}
function updateBioWordCount() {
  const bio = document.getElementById('edit-bio')?.value || '';
  const words = bio.trim().split(/\s+/).filter(w => w.length > 0).length;
  const countEl = document.getElementById('bio-word-count');
  if(countEl) countEl.textContent = words;
  if(words > 50) {
    const wordsArray = bio.trim().split(/\s+/).slice(0, 50);
    document.getElementById('edit-bio').value = wordsArray.join(' ');
    if(countEl) countEl.textContent = '50';
  }
}

async function saveProfile() {
  const name=document.getElementById('edit-name')?.value.trim();
  const bio=document.getElementById('edit-bio')?.value.trim();
  const gender=document.getElementById('edit-gender')?.value;
  const errEl=document.getElementById('edit-error');
  const fail=(k)=>{errEl.textContent=_t(k);errEl.classList.remove('hidden');};
  if(!name){fail('Name is required.');return;}
  if(name.length>40){fail('Name too long (max. 40).');return;}
  if(bio.length>600){fail('Bio too long.');return;}
  
  const bioWords = bio.split(/\s+/).filter(w => w.length > 0).length;
  if(bioWords > 50){fail('Bio can have at most 50 words.');return;}
  
  const data={name,bio:bio||'',gender:gender||null,interests:editInterests};
  await db.collection('users').doc(state.user.uid).set(data,{merge:true});
  state.profile={...state.profile,...data};
  closeEditModal(); navigate('profile'); showToast(_t('Profile saved! ✓'));
}

async function viewUserProfile(uid) {
  if(uid === state.user?.uid) { navigate('profile'); return; }
  try {
    const doc = await db.collection('users').doc(uid).get();
    state.otherUserProfile = doc.exists ? doc.data() : null;
    navigate('public-profile', {uid});
  } catch(e) {
    showToast(_t('Error loading profile'));
  }
}

function toggleFaq(i) {

function bindGaleria() {
  galleryImageB64 = null;
  
  document.getElementById('gallery-file-input')?.addEventListener('change', async e => {
    const file = e.target.files[0];
    if(!file) return;
    
    if(!isImageFile(file)) { showToast(_t('Only images (JPG, PNG, GIF, WebP).')); return; }
    if(!rateLimit('galleryUpload',15000)) { showToast(_t('Wait 15s between uploads.')); return; }
    if(file.size > 5*1024*1024) {
      showToast(_t('Photo too large (max 5MB)'));
      document.getElementById('gallery-file-input').value = '';
      return;
    }
    
    const btn = document.getElementById('gallery-select-btn');
    btn.disabled = true;
    btn.textContent = _t('Compressing...');
    
    try {
      galleryImageB64 = await compressImage(file, 1000, 0.8);
      
      document.getElementById('gallery-preview-img').src = galleryImageB64;
      document.getElementById('gallery-preview-container').style.display = 'block';
      document.getElementById('gallery-upload-btn').style.display = 'flex';
      document.getElementById('gallery-select-btn').textContent = _t('Select Another Photo');
      
      btn.disabled = false;
    } catch(err) {
      showToast(_t('Error processing photo'));
      btn.disabled = false;
      btn.textContent = _t('Select Photo');
    }
  });
}

function resetGalleryUpload() {
  galleryImageB64 = null;
  document.getElementById('gallery-file-input').value = '';
  document.getElementById('gallery-preview-container').style.display = 'none';
  document.getElementById('gallery-upload-btn').style.display = 'none';
  document.getElementById('gallery-select-btn').textContent = _t('Select Photo');
}

// CORREÇÃO 1: Remover loadGallery(), usar resetGalleryUpload()
async function uploadGalleryPhoto() {
  if(!galleryImageB64) {
    showToast(_t('Select a photo.'));
    return;
  }
  
  const btn = document.getElementById('gallery-upload-btn');
  btn.disabled = true;
  btn.textContent = _t('Sharing...');
  
  try {
    const photoData = {
      imageBase64: galleryImageB64,
      uploadedBy: state.user.uid,
      uploadedByName: state.profile?.name || state.user.email?.split('@')[0] || _t('Anonymous'),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    await db.collection('gallery').add(photoData);
    
    galleryImageB64 = null;
    resetGalleryUpload();
    
    showToast(_t('✓ Photo shared!'));
    // ✅ NÃO CHAMAR loadGallery() - o listener real-time atualiza automaticamente
  } catch(e) {
    showToast(friendlyError(e));
    btn.disabled = false;
    btn.textContent = _t('Share Photo');
  }
}

// CORREÇÃO 3: Delete photo function
async function deleteGalleryPhoto(event, photoId) {
  event.stopPropagation();
  
  if(!confirm(_t('Are you sure you want to delete this photo?'))) {
    return;
  }
  
  try {
    await db.collection('gallery').doc(photoId).delete();
    showToast(_t('✓ Photo deleted'));
  } catch(e) {
    showToast(friendlyError(e));
  }
}

function showPasswordResetModal() {
  const modal = `
    <div class="modal-overlay" id="password-reset-modal">
      <div class="modal-box">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
          <div class="modal-title" style="margin-bottom:0">${_t('Recover password').toUpperCase()}</div>
          <button class="btn-ghost btn btn-sm" onclick="closePasswordResetModal()">✕</button>
        </div>
        <p style="font-size:.85rem;color:var(--ink-light);line-height:1.6;margin-bottom:1.5rem">
          ${_t("Enter your email and we'll send you a link to create a new password.")}
        </p>
        <div id="reset-error" class="auth-error hidden"></div>
        <div class="form-group">
          <label class="label-field">Email</label>
          <input class="input" id="reset-email" type="email" placeholder="email@exemplo.com" autocomplete="email">
        </div>
        <button class="btn btn-primary btn-full" id="reset-btn" onclick="sendPasswordResetEmail()">${_t('Send Reset Link')}</button>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', modal);
}

function closePasswordResetModal() {
  document.getElementById('password-reset-modal')?.remove();
}

async function sendPasswordResetEmail() {
  const email = document.getElementById('reset-email')?.value.trim();
  const errEl = document.getElementById('reset-error');
  const btn = document.getElementById('reset-btn');
  
  if(!email) {
    errEl.textContent = _t('Enter your email.');
    errEl.classList.remove('hidden');
    return;
  }
  if(!EMAIL_RE.test(email)){ errEl.textContent=_t('Invalid email.'); errEl.classList.remove('hidden'); return; }
  
  btn.disabled = true;
  btn.textContent = _t('Sending...');
  
  try {
    await auth.sendPasswordResetEmail(email);
    errEl.classList.add('hidden');
    showToast(_t("✓ If the email exists, you'll receive a link. Check your inbox."));
    setTimeout(() => closePasswordResetModal(), 2000);
  } catch(e) {
    // SECURITY: resposta neutra — não revelar se o email existe (anti-enumeração)
    if(e.code==='auth/user-not-found'){ errEl.classList.add('hidden'); showToast(_t("✓ If the email exists, you'll receive a link. Check your inbox.")); setTimeout(() => closePasswordResetModal(), 2000); return; }
    const msgs = { 'auth/invalid-email': _t('Invalid email.'), 'auth/too-many-requests': _t('Too many attempts. Wait a few minutes.') };
    errEl.textContent = msgs[e.code] || friendlyError(e);
    errEl.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = _t('Send Reset Link');
  }
}

}
let regInterests=[];
function bindAuthForms(isLogin) {
  regInterests=[];
  document.querySelectorAll('#reg-tags .tag-select-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const t=btn.dataset.tag;
      if(regInterests.includes(t)){regInterests=regInterests.filter(x=>x!==t);btn.classList.remove('selected');}
      else{regInterests.push(t);btn.classList.add('selected');}
    });
  });
  document.getElementById('auth-btn')?.addEventListener('click',isLogin?doLogin:doRegister);
  ['auth-email','auth-pass'].forEach(id=>{
    document.getElementById(id)?.addEventListener('keydown',e=>{if(e.key==='Enter'){isLogin?doLogin():doRegister();}});
  });
}
async function doLogin() {
  const email=document.getElementById('auth-email')?.value.trim();
  const pass=document.getElementById('auth-pass')?.value;
  const errEl=document.getElementById('auth-error');
  if(!email||!pass){errEl.textContent=_t('Fill in all fields.');errEl.classList.remove('hidden');return;}
  const btn=document.getElementById('auth-btn'); btn.disabled=true; btn.textContent=_t('Signing in...');
  try { await auth.signInWithEmailAndPassword(email,pass); }
  catch(e) {
    // SECURITY: mensagem única evita enumeração de contas; nunca expor e.message
    const msgs={'auth/invalid-email':_t('Invalid email.'),'auth/too-many-requests':_t('Too many attempts. Wait a few minutes.')};
    errEl.textContent=msgs[e.code]||_t('Incorrect email or password.'); errEl.classList.remove('hidden');
    btn.disabled=false; btn.textContent=_t('Sign in');
  }
}
async function doRegister() {
  const name=document.getElementById('auth-name')?.value.trim();
  const email=document.getElementById('auth-email')?.value.trim();
  const pass=document.getElementById('auth-pass')?.value;
  const errEl=document.getElementById('auth-error');
  const fail=(k)=>{errEl.textContent=_t(k);errEl.classList.remove('hidden');};
  if(!name||!email||!pass){fail('Fill in all fields.');return;}
  if(name.length>40){fail('Name too long (max. 40 characters).');return;}
  if(!EMAIL_RE.test(email)){fail('Invalid email.');return;}
  if(pass.length<8){fail('Password must be at least 8 characters.');return;}
  if(!/[0-9]/.test(pass)||!/[a-zA-Z]/.test(pass)){fail('Password must include letters and numbers.');return;}
  const btn=document.getElementById('auth-btn'); btn.disabled=true; btn.textContent=_t('Creating account...');
  try {
    const cred=await auth.createUserWithEmailAndPassword(email,pass);
    try{ await cred.user.sendEmailVerification(); }catch(_){/* não bloquear o registo */}
    await db.collection('users').doc(cred.user.uid).set({
      name,email,interests:regInterests,bio:'',gender:null,xp:0,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    window._showRegister=false;
  } catch(e) {
    const msgs={'auth/email-already-in-use':_t('Email already in use.'),'auth/invalid-email':_t('Invalid email.'),'auth/weak-password':_t('Password too weak.')};
    errEl.textContent=msgs[e.code]||friendlyError(e); errEl.classList.remove('hidden');
    btn.disabled=false; btn.textContent=_t('Create account');
  }
}
async function logout() {
  if(state.chatUnsub){state.chatUnsub();state.chatUnsub=null;}
  if(state.questsUnsub){state.questsUnsub();state.questsUnsub=null;}
  await auth.signOut();
}

function loadQuests() {
  return new Promise((resolve) => {
    if(state.questsUnsub) state.questsUnsub();
    
    let isFirstSnapshot = true;
    
    state.questsUnsub = db.collection('quests').orderBy('createdAt','desc').limit(100).onSnapshot(snap => {
      state.quests = snap.docs.map(doc => {return {id:doc.id,...doc.data()}});

      // PERF: mostrar as quests JÁ — os perfis dos membros carregam em paralelo, em background
      if(isFirstSnapshot) {
        isFirstSnapshot = false;
        state.questsLoaded = true;
        resolve();
      }
      if(['feed','explore'].includes(state.currentPage)) navigate(state.currentPage);

      const allUserIds = new Set();
      state.quests.forEach(q => (q.members || []).forEach(uid => allUserIds.add(uid)));
      const missing = [...allUserIds].filter(uid => !userCache[uid]);
      if(missing.length) Promise.all(missing.map(uid => getUserData(uid))).catch(()=>{});
    });
  });
}

async function loadProfile(uid) {
  try {
    const doc=await db.collection('users').doc(uid).get();
    state.profile=doc.exists?doc.data():{name:'',bio:'',interests:[],xp:0,completedQuests:[]};
    if(!state.profile.completedQuests) state.profile.completedQuests=[];
  } catch(e) { state.profile={name:'',bio:'',interests:[],xp:0,completedQuests:[]}; }
}

// ════════════════════════════════════════════
// EXPIRED QUESTS - CHECK & MODAL
// ════════════════════════════════════════════
async function checkExpiredQuests() {
  if(!state.user) return;
  
  const now = new Date();
  const creatorQuests = state.quests.filter(q => q.createdBy === state.user.uid && !q.completed);
  
  for(const quest of creatorQuests) {
    const questTime = new Date(quest.date?.toDate?.() || new Date(quest.date));
    if(questTime <= now && !quest.expired) {
      await db.collection('quests').doc(quest.id).update({ expired: true });
      showExpiredQuestModal(quest);
      break;
    }
  }
}

function showExpiredQuestModal(quest) {
  const participants = quest.members || [];
  
  const modalHTML = `
    <div class="modal-overlay" id="expired-modal">
      <div class="modal-box">
        <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
          <span style="font-family:var(--font-display);font-size:1.6rem;letter-spacing:2px;color:var(--ink)">${_t('Did the quest “{title}” take place?',{title:esc(quest.title)})}</span>
          <button class="modal-close" onclick="closeExpiredModal()" style="border:none;background:none;color:var(--ink-light);font-size:1.5rem;cursor:pointer;padding:0">✕</button>
        </div>
        
        <p style="color:var(--ink-light);margin-bottom:1.5rem">
          ${_t('Date:')} <strong>${quest.date ? new Date(quest.date?.toDate?.() || new Date(quest.date)).toLocaleDateString(loc()) : 'N/A'}</strong>
        </p>
        
        <h3 style="font-weight:600;margin-bottom:1rem;color:var(--ink)">${_t('Registered Participants')}</h3>
        <div id="participants-list" style="max-height:400px;overflow-y:auto;margin-bottom:1.5rem">
          ${participants.length > 0 
            ? `<p style="color:var(--ink-light);font-size:.9rem;margin-bottom:.8rem">${_t('Select who was actually present (everyone is selected by default):')}</p>`
            : `<p style="color:var(--ink-light)">${_t('Nobody signed up for this quest.')}</p>`}
          ${participants.map(uid => renderParticipantCheckbox(quest.id, uid)).join('')}
        </div>
        
        <div style="display:flex;gap:.8rem;margin-top:2rem;justify-content:flex-end">
          <button class="btn btn-secondary" onclick="closeExpiredModal()">${_t('No, not yet')}</button>
          <button class="btn btn-primary" onclick="confirmQuestCompletion('${quest.id}')">${_t('Yes, it happened ✓')}</button>
        </div>
      </div>
    </div>
  `;
  
  document.body.insertAdjacentHTML('beforeend', modalHTML);
  state.expiredQuestModal = quest.id;
  
  state.selectedParticipants[quest.id] = [...participants];
  
  participants.forEach(async uid => {
    const userData = await getUserData(uid);
    const nameEl = document.getElementById(`participant-name-${uid}`);
    const emailEl = document.getElementById(`participant-email-${uid}`);
    if (nameEl) nameEl.textContent = userData.name || _t('User');
    if (emailEl) emailEl.textContent = userData.email || '';
  });
  
  document.querySelectorAll(`[data-quest="${quest.id}"]`).forEach(checkbox => {
    checkbox.checked = true;
    checkbox.addEventListener('change', (e) => {
      const uid = e.target.dataset.uid;
      if(e.target.checked) {
        if(!state.selectedParticipants[quest.id].includes(uid)) {
          state.selectedParticipants[quest.id].push(uid);
        }
      } else {
        state.selectedParticipants[quest.id] = state.selectedParticipants[quest.id].filter(u => u !== uid);
      }
    });
  });
}

function renderParticipantCheckbox(questId, uid) {
  const userData = userCache[uid];
  const name = userData?.name || _t('Loading...');
  const email = userData?.email || '';
  const photoURL = userData?.photoURL;
  
  const photoHtml = photoURL 
    ? `<img src="${safeImg(photoURL)}" alt="avatar" style="width:36px;height:36px;border-radius:50%;object-fit:cover">`
    : `<div style="width:36px;height:36px;border-radius:50%;background:${getAvatarColor(uid)};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.8rem">${getInitials(uid.slice(0,4))}</div>`;
  
  return `
    <div class="participant-item">
      <input type="checkbox" data-quest="${questId}" data-uid="${uid}" checked>
      <div style="width:36px;height:36px;flex-shrink:0">
        ${photoHtml}
      </div>
      <div class="participant-info">
        <div class="participant-name" id="participant-name-${uid}">${esc(name)}</div>
        <div class="participant-email" id="participant-email-${uid}">${esc(maskEmail(email))}</div>
      </div>
    </div>
  `;
}

async function confirmQuestCompletion(questId) {
  const quest = state.quests.find(q => q.id === questId);
  const selectedParticipants = state.selectedParticipants[questId] || [];
  
  try {
    await db.collection('quests').doc(questId).update({
      completed: true,
      completedAt: firebase.firestore.FieldValue.serverTimestamp(),
      presentMembers: selectedParticipants
    });
    
    const creatorRef = db.collection('users').doc(state.user.uid);
    await creatorRef.update({
      completedQuests: firebase.firestore.FieldValue.arrayUnion(questId),
      xp: firebase.firestore.FieldValue.increment(XP_PER_QUEST)
    });
    
    for(const uid of selectedParticipants) {
      const participantRef = db.collection('users').doc(uid);
      await participantRef.update({
        completedQuests: firebase.firestore.FieldValue.arrayUnion(questId),
        xp: firebase.firestore.FieldValue.increment(XP_PER_QUEST)
      });
    }
    
    closeExpiredModal();
    showToast(_t('✓ Quest marked as completed!'));
    
    await loadProfile(state.user.uid);
    loadQuests();
  } catch(e) {
    console.error('Erro ao confirmar quest:', e);
    showToast(_t('Error updating quest'));
  }
}

function closeExpiredModal() {
  const modal = document.getElementById('expired-modal');
  if(modal) modal.remove();
  state.expiredQuestModal = null;
}

// ════════════════════════════════════════════
// FOOTER STATS
// ════════════════════════════════════════════
function updateFooterStats() {
  const completedQuests = state.quests.filter(q => q.completed).length;
  const totalUsers = new Set(state.quests.flatMap(q => q.members || [])).size;
  
  // Simular países (basado em locais únicos)
  const locations = new Set(state.quests.map(q => q.location).filter(Boolean));
  const countries = Math.max(5, Math.ceil(locations.size / 2)); // Estimativa
  
  // Simular km (basado em quests × média)
  const km = completedQuests * 15 + totalUsers * 2;
  
  // Atualizar DOM
  const el1 = document.getElementById('stat-quests');
  const el2 = document.getElementById('stat-explorers');
  const el3 = document.getElementById('stat-countries');
  const el4 = document.getElementById('stat-km');
  
  if(el1) animateCounter(el1, 37, Math.max(50, completedQuests * 10));
  if(el2) animateCounter(el2, 112, Math.max(150, totalUsers * 5));
  if(el3) animateCounter(el3, 5, Math.max(5, countries));
  if(el4) el4.textContent = km.toLocaleString(loc());
}

function animateCounter(el, from, to) {
  const duration = 1500;
  const startTime = Date.now();
  
  const animate = () => {
    const now = Date.now();
    const progress = Math.min((now - startTime) / duration, 1);
    const current = Math.floor(from + (to - from) * progress);
    
    el.textContent = current.toLocaleString(loc());
    
    if(progress < 1) {
      requestAnimationFrame(animate);
    }
  };
  
  animate();
}

// O tipo (bug/ideia) e a página atual vão como prefixo da mensagem, para não alterar
// os campos do documento 'feedback' (e assim não colidir com as Security Rules).
let feedbackType = 'bug';
function setFeedbackType(type) {
  feedbackType = type;
  document.getElementById('fb-type-bug')?.classList.toggle('selected-bug', type==='bug');
  document.getElementById('fb-type-idea')?.classList.toggle('selected-bug', type==='idea');
}
function showFeedbackModal() {
  document.getElementById('feedback-modal')?.classList.remove('hidden');
  setTimeout(()=>document.getElementById('feedback-text')?.focus(), 50);
}
function closeFeedbackModal() {
  document.getElementById('feedback-modal')?.classList.add('hidden');
  const ta = document.getElementById('feedback-text');
  if(ta) ta.value = '';
}
async function sendFeedback() {
  const text = document.getElementById('feedback-text')?.value.trim();
  if(!text) { showToast(_t('Write something first.')); return; }
  if(text.length>450) { showToast(_t('Max. 450 characters.')); return; }
  if(!rateLimit('feedback',20000)) { showToast(_t('Wait a moment between reports.')); return; }
  
  const btn = document.getElementById('feedback-send-btn');
  if(btn) { btn.disabled = true; btn.textContent = _t('Sending...'); }
  
  try {
    const prefix = '[' + (feedbackType==='bug' ? 'BUG' : 'IDEA') + ' | ' + state.currentPage + '] ';
    // Guardar feedback no Firestore
    await db.collection('feedback').add({
      message: prefix + text,
      userId: state.user?.uid,
      userEmail: state.user?.email,
      userName: state.profile?.name,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      userAgent: navigator.userAgent
    });
    
    showToast(_t('Thanks! We got your report ✓'));
    closeFeedbackModal();
    if(btn) { btn.disabled = false; btn.textContent = _t('Send'); }
  } catch(e) {
    showToast(friendlyError(e));
    if(btn) { btn.disabled = false; btn.textContent = _t('Send'); }
  }
}

  input.addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase();
    if(!query) { resultsEl.innerHTML = ''; return; }
    
    const filtered = state.quests.filter(q => 
      !q.expired && !q.completed &&
      (q.title.toLowerCase().includes(query) || 
       q.description?.toLowerCase().includes(query) || 
       q.location?.toLowerCase().includes(query) ||
       q.tags?.some(tg => tg.toLowerCase().includes(query) || tagLabel(tg).toLowerCase().includes(query)))
    );
    
    resultsEl.innerHTML = filtered.slice(0, 8).map(q => `
      <div style="padding:1rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s" onclick="navigate('quest', state.quests.find(x=>x.id==='${q.id}')); closeGlobalSearch();" onmouseover="this.style.background='var(--green-pale)'" onmouseout="this.style.background='transparent'">
        <div style="font-weight:600;color:var(--ink);margin-bottom:.25rem">${esc(q.title)}</div>
        <div style="font-size:.75rem;color:var(--ink-light)">📍 ${esc(q.location || _t('Location TBD'))} · 👥 ${q.members?.length || 0}/${q.maxPeople || 10}</div>
      </div>
    `).join('') || `<div style="padding:2rem;text-align:center;color:var(--ink-light)">${_t('No quests found')}</div>`;
  });
}

function closeGlobalSearch() {
  document.getElementById('global-search-modal')?.remove();
  globalSearchOpen = false;
}

// ════════════════════════════════════════════
// AUTH LISTENER — ENTRY POINT
// ════════════════════════════════════════════
auth.onAuthStateChanged(async user=>{
  state.user = user;
  if(user) {
    await loadProfile(user.uid);
    // PERF: renderizar já — o listener das quests re-renderiza o feed quando os dados chegarem
    state.currentPage = 'feed';
    render();
    loadQuests();
    // PERF: galeria só carrega quando o utilizador abre a página (lazy)
    setInterval(checkExpiredQuests, 10000);
  } else {
    if(state.questsUnsub){ state.questsUnsub(); state.questsUnsub = null; }
    if(galleryUnsub){ galleryUnsub(); galleryUnsub = null; }
    state.quests = []; state.profile = null; state.activeQuest = null;
    state.questsLoaded = false;
    render();
  }
});
</script>
